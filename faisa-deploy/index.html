    ${over?`<div class="note warn" style="margin:14px 0">⚠ This leaves ${a.name} at ${fmt(remaining,cur)}. You can still record it — the app won't block you, but it will confirm first.</div>`:''}
    <button class="btn wide ${over?'danger':(c.cls==='mvr'?'mvr':'')}" style="margin-top:16px" ${amt?'':'disabled'} onclick="doSpend('${id}')">
      ${amt?'Deduct '+fmt(amt,cur):'Enter an amount'}</button>
    <div style="height:10px"></div>`;
}
function softTracker(){
  const id=S.ui.stack[S.ui.stack.length-1].data.id,a=acct(id),cur=a.currency,c=CUR[cur];
  const bal=balance(id),p=parseAmount(TR.amount,cur),amt=p.minor||0;
  const remaining=bal-amt,over=remaining<0&&bal>=0,pct=bal>0?Math.min(amt/bal,1):0;
  const g=document.querySelector('.gwrap');
  if(g){g.innerHTML=gaugeSVG(pct,over?'#FF3B30':c.color)+
    `<div class="gcenter"><div class="l">Remaining</div><div class="v ${remaining<0?'neg':''}">${fmt(remaining,cur)}</div>
     <span class="badge ${c.cls}">${cur}</span></div>`;}
  const st=document.querySelectorAll('.gstats .s b');
  if(st[1]) st[1].textContent=amt?fmt(amt,cur):'—';
  const btn=document.querySelector('.btn.wide');
  if(btn){btn.disabled=!amt;btn.textContent=amt?'Deduct '+fmt(amt,cur):'Enter an amount';
    btn.className='btn wide '+(over?'danger':(c.cls==='mvr'?'mvr':''));btn.style.marginTop='16px';}
}
function bump(q){const cur=acct(S.ui.stack[S.ui.stack.length-1].data.id).currency;
  const p=parseAmount(TR.amount,cur);TR.amount=(((p.minor||0)/100)+q).toString();render();}
function doSpend__inner(id){
  const a=acct(id),p=parseAmount(TR.amount,a.currency);
  if(p.err){TR.err=p.err;render();return}
  const bal=balance(id);
  if(bal-p.minor<0&&bal>=0){
    if(!confirm(`This leaves ${a.name} at ${fmt(bal-p.minor,a.currency)}. Record it anyway?`)) return;
  }
  S.txns.unshift({id:uid(),accountId:id,currency:a.currency,amount:p.minor,dir:'debit',categoryId:TR.cat,
    merchant:TR.merchant||null,note:(TR.note||'').trim()||null,
    at:new Date().toISOString(),sync:S.offline?'pendingCreate':'synced',fx:null});
  enqueue('transaction','create');
  const rem=balance(id);
  toast(S.offline?'info':'ok',S.offline?'Saved offline — will sync later':`${fmt(p.minor,a.currency)} · ${a.name} → ${fmt(rem,a.currency)}`);
  TR={amount:'',cat:TR.cat,merchant:'',note:'',err:null};render();
  checkBudgets();
}

function delTxn__inner(id){
  const t=S.txns.find(x=>x.id===id);
  if(!t) return;
  if(t.transferId){
    // Both legs go together — a half transfer would leave one ledger wrong.
    const legs=deleteTransfer(t.transferId);
    pop();
    toast('info','Transfer deleted (both entries)',()=>{
      withSync(()=>{legs.forEach(l=>S.txns.push(l));
        S.txns.sort((x,y)=>new Date(y.at)-new Date(x.at));});render();});
    return;
  }
  const i=S.txns.indexOf(t);
  S.txns.splice(i,1);enqueue('transaction','delete');pop();
  checkBudgets();   // deleting spend can drop a category back under its limit
  toast('info','Transaction deleted',()=>{withSync(()=>{S.txns.splice(i,0,t)});render()});
}

/* ===== Transfer handlers ===== */
function ratePresets(base,quote){
  const p=S.rates.find(r=>r.base===base&&r.quote===quote);
  const inv=S.rates.find(r=>r.base===quote&&r.quote===base);
  const opts=[];
  if(p) opts.push(['Pinned',p.rate]);
  if(!p&&inv) opts.push(['Pinned (inverted)',+(1/inv.rate).toFixed(6)]);
  if(!opts.length) return '';
  return `<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">${opts.map(([l,v])=>
    `<button class="chip" style="background:var(--fill);color:var(--txt)"
      onclick="sheetState.form.rate='${v}';sheetState.form.errs={};renderSheet()">${l}: ${v}</button>`).join('')}</div>`;
}
function pickTransfer(side,id){
  const f=sheetState.form;
  if(side==='from'&&id===f.to){ f.to=f.from; }      // picking the destination as source swaps them
  f[side]=id; f.errs={};
  const from=acct(f.from),to=acct(f.to);
  if(from&&to&&from.currency!==to.currency&&!f.rate){
    const p=S.rates.find(r=>r.base===from.currency&&r.quote===to.currency);
    const inv=S.rates.find(r=>r.base===to.currency&&r.quote===from.currency);
    f.rate=p?String(p.rate):(inv?String(+(1/inv.rate).toFixed(6)):'');
  }
  renderSheet();
}
function swapTransfer(){
  const f=sheetState.form;
  const from=acct(f.from),to=acct(f.to);
  [f.from,f.to]=[f.to,f.from];
  // Invert the rate so the transfer keeps its real-world meaning after a swap.
  if(from&&to&&from.currency!==to.currency){
    const rr=parseRate(f.rate);
    if(rr.rate) f.rate=String(+(1/rr.rate).toFixed(6));
  }
  f.errs={}; renderSheet();
}
function softTransfer(){
  const f=sheetState.form;
  const pv=transferPreview(f.from,f.to,f.amount,f.rate);
  const from=acct(f.from),to=acct(f.to);
  const sides=document.querySelectorAll('.tvis .side .am');
  if(sides[0]) sides[0].textContent=pv.out?'−'+fmt(pv.out.minor,pv.out.cur):fmt(0,from.currency);
  if(sides[1]) sides[1].textContent=pv.inn?'+'+fmt(pv.inn.minor,pv.inn.cur):fmt(0,to.currency);
  const hasWarn=!!document.querySelector('.sbody .note.warn');
  if(!!pv.over!==hasWarn){
    renderSheet();
    setTimeout(()=>{const i=document.getElementById('tfAmt');
      if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}},0);
  }
}
function saveTransfer__inner(){
  const f=sheetState.form;
  const res=commitTransfer(f.from,f.to,f.amount,f.rate,f.note);
  if(res.errs){ f.errs=res.errs; renderSheet(); return; }
  const from=acct(f.from),to=acct(f.to);
  toast(S.offline?'info':'ok', S.offline
    ? 'Transfer saved offline — syncs later'
    : (res.cross
        ? `${fmt(res.out.minor,res.out.cur)} → ${fmt(res.inn.minor,res.inn.cur)}`
        : `${fmt(res.out.minor,res.out.cur)} · ${from.name} → ${to.name}`));
  closeSheet(); render();
}

/* ===== Recurring handlers ===== */
function saveRec__inner(){
  const f=sheetState.form,a=acct(f.acct);
  f.errs={};
  if(!(f.name||'').trim()) f.errs.name='Give this a name';
  const p=parseAmount(f.amount,a?a.currency:'MVR');
  if(p.err) f.errs.amount=p.err;
  if(!a) f.errs.amount='Pick an account';
  if(Object.values(f.errs).some(Boolean)){ renderSheet(); return; }

  if(f.id){
    const r=S.recurring.find(x=>x.id===f.id);
    const wasInactive=!r.active;
    Object.assign(r,{name:f.name.trim(),accountId:a.id,currency:a.currency,amount:p.minor,
      dir:f.dir,categoryId:f.cat,day:f.day,active:f.active});
    // Re-activating shouldn't back-post every month it was paused.
    if(wasInactive&&f.active) r.lastRun=lastDueKey(r);
    enqueue('recurring','update'); toast('ok','Recurring updated');
  } else {
    const r={id:uid(),name:f.name.trim(),accountId:a.id,currency:a.currency,amount:p.minor,
      dir:f.dir,categoryId:f.cat,day:f.day,active:f.active,lastRun:null,created:new Date().toISOString()};
    // Start from the next occurrence — creating a rule never back-posts history.
    r.lastRun=lastDueKey(r);
    S.recurring.push(r);
    enqueue('recurring','create');
    toast('ok',`${r.name} · next ${nextDue(r).toLocaleDateString('en',{day:'numeric',month:'short'})}`);
  }
  closeSheet(); render();
}
function delRec__inner(id){
  const r=S.recurring.find(x=>x.id===id),i=S.recurring.indexOf(r);
  S.recurring.splice(i,1); enqueue('recurring','delete');
  closeSheet(); render();
  toast('info','Recurring item deleted',()=>{withSync(()=>{S.recurring.splice(i,0,r)});render()});
}
function toggleRec__inner(id,ev){
  if(ev) ev.stopPropagation();
  const r=S.recurring.find(x=>x.id===id);
  r.active=!r.active;
  if(r.active) r.lastRun=lastDueKey(r);   // resume without back-posting
  enqueue('recurring','update');
  render();
  toast('ok',r.name+(r.active?' resumed':' paused'));
}
function runRecurringNow__inner(){
  const n=runRecurring();
  render();
  toast(n?'ok':'info', n?`Posted ${n} scheduled item${n>1?'s':''}`:'Nothing due right now');
  checkBudgets();   // a posted bill can push a category over its cap
}

function saveTxn__inner(){
  const f=sheetState.form,a=acct(f.acct);
  if(!a){f.errs.amount='Pick an account';renderSheet();return}
  const p=parseAmount(f.amount,a.currency);
  f.errs={};
  if(p.err) f.errs.amount=p.err;
  if(!f.cat) f.errs.cat='Pick a category';
  let fx=null;
  if(f.fx){
    const rr=parseRate(f.rate);
    if(rr.err){renderSheet();return}
    if(rr.rate&&p.minor) fx={base:a.currency,quote:a.currency==='INR'?'MVR':'INR',rate:rr.rate,converted:Math.round(p.minor*rr.rate)};
  }
  if(Object.values(f.errs).some(Boolean)){renderSheet();return}

  const note=(f.note||'').trim()||null;
  if(f.id){
    const t=S.txns.find(x=>x.id===f.id);
    Object.assign(t,{accountId:a.id,currency:a.currency,amount:p.minor,dir:f.dir,categoryId:f.cat,
      merchant:f.merchant||null,note,fx,sync:S.offline?'pendingUpdate':'synced'});
    enqueue('transaction','update');toast('ok','Updated');
  } else {
    S.txns.unshift({id:uid(),accountId:a.id,currency:a.currency,amount:p.minor,dir:f.dir,categoryId:f.cat,
      merchant:f.merchant||null,note,at:new Date().toISOString(),sync:S.offline?'pendingCreate':'synced',fx});
    enqueue('transaction','create');
    toast(S.offline?'info':'ok',
      S.offline?'Saved offline — will sync later':`${fmt(p.minor,a.currency)} · ${a.name} → ${fmt(balance(a.id),a.currency)}`);
  }
  S.txns.sort((x,y)=>new Date(y.at)-new Date(x.at));
  closeSheet();render();
  // Crossing a category limit is announced right here, once, with the OS
  // notification and an inbox entry — see checkBudgets().
  checkBudgets();
}

function saveAcct__inner(){
  const f=sheetState.form;f.errs={};

      opening:open,mask:f.mask||null,color:f.color,include:f.include,archived:false});

}

function saveBudget__inner(){
  const f=sheetState.form;f.errs={};
  const n=parseFloat(String(f.raw).replace(/,/g,''));
  if(isNaN(n)||n<=0) f.errs.limit='Enter a monthly limit above zero';
  else if(n>1e9) f.errs.limit='That limit is too large';
  if(!f.cat) f.errs.limit=f.errs.limit||'Pick a category';
  if(Object.values(f.errs).some(Boolean)){renderSheet();return}

  const limit=Math.round(n*100);
  S.budgets=S.budgets||[];
  const clash=S.budgets.find(b=>b.categoryId===f.cat&&b.currency===f.cur&&b.id!==f.id);
  const rec=clash||(f.id?S.budgets.find(b=>b.id===f.id):null);

  if(rec){
    Object.assign(rec,{categoryId:f.cat,currency:f.cur,limit,updatedAt:new Date().toISOString()});
    // Re-baseline so a raised limit can warn again, a lowered one can trip now.
    rec.lastLevel=budLevel(catSpent(f.cat,f.cur,new Date()),limit);
    rec.notifiedMonth=null; rec.notifiedLevel=null;
    toast('ok',`${cat(f.cat).name} limit: ${fmt(limit,f.cur)}/month`);
  } else {
    S.budgets.push({id:uid(),categoryId:f.cat,currency:f.cur,limit,
      lastLevel:'ok',notifiedMonth:null,notifiedLevel:null,createdAt:new Date().toISOString()});
    toast('ok',`${cat(f.cat).name} capped at ${fmt(limit,f.cur)}/month`);
  }
  closeSheet();render();
  checkBudgets();   // an already-breached limit should surface immediately
}

function delBudget__inner(id){

  S.budgets=(S.budgets||[]).filter(x=>x.id!==id);

function saveRate__inner(){
  const f=sheetState.form,rr=parseRate(f.raw);
  if(rr.err){f.errs.rate=rr.err;renderSheet();return}
  if(!rr.rate){f.errs.rate='Exchange rate must be greater than zero';renderSheet();return}
  S.rates=S.rates.filter(r=>!(r.base===f.base&&r.quote===f.quote));
  S.rates.push({base:f.base,quote:f.quote,rate:rr.rate,pinned:true,at:new Date().toISOString()});
  enqueue('exchangeRate','create');
  toast('ok',`Rate pinned: 1 ${f.base} = ${rr.rate} ${f.quote}`);
  closeSheet();render();
}

function doDelete__inner(){
  const f=sheetState.form,id=sheetState.data.id,a=acct(id);
  const n=S.txns.filter(t=>t.accountId===id).length;
  if(n>0&&f.choice===1){
    const t=acct(f.target);
    if(!t){f.errs.del='Pick an account';renderSheet();return}
    if(t.currency!==a.currency){f.errs.del=`A ${a.currency} transaction can't move to a ${t.currency} account`;renderSheet();return}
    S.txns.forEach(x=>{if(x.accountId===id)x.accountId=f.target});
    S.accounts=S.accounts.filter(x=>x.id!==id);
  } else if(n>0&&f.choice===2){
    a.archived=true;a.include=false;
  } else {
    S.txns=S.txns.filter(x=>x.accountId!==id);
    S.accounts=S.accounts.filter(x=>x.id!==id);
  }
  enqueue('account','delete');
  toast('ok',a.name+(n>0&&f.choice===2?' archived':' removed'));
  closeSheet();
  if(S.ui.stack.length&&S.ui.stack[S.ui.stack.length-1].route==='acct') pop(); else render();
}

/* ============ SYNC BRIDGE ============ */
/* Local-first: every mutation applies to S immediately, is snapshotted to
   localStorage, and is emitted as an op. The network is never awaited. */

const Sync = window.FaisaaSync || { deviceId:"offline", deviceName:"Device", online:false, peers:0, peerNames:[], outbox:[], loadLocal:function(){return null;}, saveLocal:function(){}, push:function(){}, flush:function(){}, start:function(){}, setName:function(){} };
let applyingRemote = false;          // guard: don't echo remote ops back out

function snapshot(){
  return { accounts:S.accounts, txns:S.txns, recurring:S.recurring,
           rates:S.rates, settings:S.settings,
           budgets:S.budgets||[], alerts:S.alerts||[] };
}
function saveLocal(){ Sync.saveLocal(snapshot()); }

/* Emit one op + persist. Called by the mutation wrappers below. */
function emit(entity,id,op,data){
  saveLocal();
  if(!applyingRemote) Sync.push(entity,id,op,data);
}
const opAccount   = (a,op='update')=>emit('account',a.id,op,op==='delete'?null:a);
const opTxn       = (t,op='update')=>emit('txn',t.id,op,op==='delete'?null:t);
const opRecurring = (r,op='update')=>emit('recurring',r.id,op,op==='delete'?null:r);
const opRate      = (r,op='update')=>emit('rate',r.id,op,op==='delete'?null:r);
const opSettings  = ()=>{ saveLocal(); if(!applyingRemote) Sync.push('settings','settings','update',S.settings); };

/* ---- Diff-based capture ----
   Rather than editing 30 call sites, we snapshot before a mutation and emit
   ops for whatever actually changed. Robust and impossible to forget. */
function withSync(fn){
  // Defensive: a partially-restored S must never take the UI down.
  S.accounts=S.accounts||[]; S.txns=S.txns||[]; S.recurring=S.recurring||[];
  S.rates=S.rates||[]; S.budgets=S.budgets||[]; S.alerts=S.alerts||[];
  S.settings=S.settings||{primary:'MVR',hints:false};
  const before = {
    accounts:new Map(S.accounts.map(x=>[x.id,JSON.stringify(x)])),
    txns:new Map(S.txns.map(x=>[x.id,JSON.stringify(x)])),
    recurring:new Map((S.recurring||[]).map(x=>[x.id,JSON.stringify(x)])),
    rates:new Map((S.rates||[]).map(x=>[x.id||x.base+x.quote,JSON.stringify(x)])),
    budgets:new Map((S.budgets||[]).map(x=>[x.id,JSON.stringify(x)])),
    settings:JSON.stringify(S.settings)
  };
  const out = fn();
  const pairs=[['accounts','account',S.accounts],['txns','txn',S.txns],
               ['recurring','recurring',S.recurring||[]],['rates','rate',S.rates||[]],
               ['budgets','budget',S.budgets||[]]];
  for(const [key,entity,list] of pairs){
    const seen=new Set();
    for(const rec of list){
      const id = rec.id || (rec.base+rec.quote);
      if(!rec.id) rec.id=id;
      seen.add(id);
      const prev=before[key].get(id);
      if(prev!==JSON.stringify(rec)) emit(entity,id,'update',rec);
    }
    for(const id of before[key].keys()) if(!seen.has(id)) emit(entity,id,'delete',null);
  }
  if(before.settings!==JSON.stringify(S.settings)) opSettings();
  saveLocal();
  return out;
}

/* ---- Apply inbound ---- */
function applyRemoteState(remote){
  applyingRemote = true;
  S.accounts  = remote.accounts  || [];
  S.txns      = remote.txns      || [];
  S.recurring = remote.recurring || [];
  S.rates     = remote.rates     || [];
  S.budgets   = remote.budgets   || [];
  // Alerts are per-device notifications, not shared ledger data. Adopting a
  // remote snapshot must never clear what this device has already told you.
  if(!S.alerts) S.alerts=[];
  if(remote.settings) S.settings = Object.assign({}, S.settings, remote.settings);
  S.txns.sort((a,b)=>new Date(b.at)-new Date(a.at));
  applyingRemote = false;
  saveLocal();
}
function applyRemoteOps(ops){
  applyingRemote = true;
  const COLL={account:'accounts',txn:'txns',recurring:'recurring',rate:'rates',budget:'budgets'};
  let touched=0;
  for(const op of ops){
    if(op.entity==='settings'){ S.settings=Object.assign({},S.settings,op.data||{}); touched++; continue; }
    const key=COLL[op.entity]; if(!key) continue;
    if(!S[key]) S[key]=[];
    const list=S[key], i=list.findIndex(r=>r.id===op.id);
    if(op.op==='delete'){ if(i>=0){ list.splice(i,1); touched++; } }
    else { const rec=Object.assign({},op.data,{id:op.id});
           if(i<0){ list.push(rec); touched++; } else { list[i]=rec; touched++; } }
  }
  if(touched) S.txns.sort((a,b)=>new Date(b.at)-new Date(a.at));
  applyingRemote = false;
  saveLocal();
  return touched;
}

/* ---- Wire up ---- */

/* Push the complete local ledger to the server (first device, or recovery). */
function uploadEverything(){
  const ops=[];
  const add=(entity,list)=>{ (list||[]).forEach(r=>{
      const id=r.id||(r.base&&r.quote?r.base+r.quote:null); if(!id) return;
      if(!r.id) r.id=id;
      ops.push({entity,id,op:'update',data:r,ts:Date.now(),dev:Sync.deviceId}); }); };
  add('account',S.accounts); add('txn',S.txns);
  add('recurring',S.recurring); add('rate',S.rates); add('budget',S.budgets||[]);
  ops.push({entity:'settings',id:'settings',op:'update',data:S.settings,ts:Date.now(),dev:Sync.deviceId});
  Sync.outbox.push(...ops);
  Sync.flush();
  saveLocal();
}

/* After adopting server state, re-upload any local records it lacked. */
function pushMissingToServer(remote){
  const have=k=>new Set((remote[k]||[]).map(r=>r.id));
  const pairs=[['accounts','account'],['txns','txn'],['recurring','recurring'],['rates','rate'],['budgets','budget']];
  const local=Sync.loadLocal();
  if(!local) return;
  let n=0;
  for(const [key,entity] of pairs){
    const remoteIds=have(key);
    for(const rec of (local[key]||[])){
      if(rec.id && !remoteIds.has(rec.id)){
        S[key]=S[key]||[];
        if(!S[key].some(x=>x.id===rec.id)) S[key].push(rec);
        Sync.push(entity,rec.id,'update',rec); n++;
      }
    }
  }
  if(n){ S.txns.sort((a,b)=>new Date(b.at)-new Date(a.at)); saveLocal(); }
}

Sync.onchange = (payload, kind)=>{
  if(kind==='hello'){
    // The server is authoritative ONLY if it actually holds a usable ledger.
    // An account-less server state means nobody has uploaded yet (or the data
    // was reset) — in that case we must never wipe good local data. We upload.
    const remoteUsable = payload && payload.accounts && payload.accounts.length > 0;
    const localUsable  = S.accounts && S.accounts.length > 0;

    if(remoteUsable){
      applyRemoteState(payload);
      // Anything we hold that the server has never seen still gets pushed up,
      // so a device that was offline doesn't silently lose its work.
      pushMissingToServer(payload);
      render();
    } else if(localUsable){
      uploadEverything();     // seed the shared ledger from this device
    }
  } else if(kind==='ops'){
    const mine = payload.filter(o=>o.dev!==Sync.deviceId);
    if(!mine.length) return;
    const n = applyRemoteOps(mine);
    if(n){
      render();
      const who = Sync.peerNames[0] ? ' from '+Sync.peerNames[0] : '';
      toast('info','Updated'+who);
    }
  }
};
Sync.onstatus = ()=>{ paintSyncPill(); };

function paintSyncPill(){
  const el=document.getElementById('syncPill');
  if(!el || !window.FaisaaSync) return;
  const on=Sync.online, q=Sync.outbox.length;
  el.className='syncpill '+(on?(Sync.peers?'live':'ok'):'off');
  el.innerHTML = on
    ? (Sync.peers
        ? `<i class="dot"></i>${Sync.peers+1} devices live`
        : (q?`<i class="dot"></i>Syncing ${q}`:`<i class="dot"></i>Synced`))
    : `<i class="dot"></i>${q?q+' queued':'Offline'}`;
  const st=document.getElementById('syncStatusLine');
  if(st) st.textContent = on
    ? (Sync.peers?`Live · ${Sync.peers+1} devices connected`:'Connected · waiting for other devices')
    : (q?`Offline · ${q} change${q>1?'s':''} queued`:'Offline · changes saved on this device');
}

/* ---- Boot ---- */
function boot(){
  const local = Sync.loadLocal();
  // Always seed first: this guarantees S has its full shape (settings, ui,
  // queue, offline). Restoring only overwrites the persisted collections.
  seed();
  if(local && local.accounts){
    S.accounts  = local.accounts  || [];
    S.txns      = local.txns      || [];
    S.recurring = local.recurring || [];
    S.rates     = local.rates     || [];
    S.budgets   = local.budgets   || [];
    S.alerts    = local.alerts    || [];
    S.settings  = Object.assign({}, S.settings, local.settings || {});
    S.txns.sort((a,b)=>new Date(b.at)-new Date(a.at));
  } else {
    saveLocal();          // first ever launch on this device — keep the demo data
    S.ui.freshSeed = true;
  }
  withSync(()=>{ runRecurring(); });
  render();
  paintSyncPill();
  Sync.start();
  // Catch anything that crossed a limit while the app was closed.
  setTimeout(()=>{ try{ checkBudgets(); render(); }catch(e){ console.warn('[Faisaa] budget check',e); } }, 400);
  // Coming back from the background counts as a fresh look.
  document.addEventListener('visibilitychange',()=>{
    if(!document.hidden){
      try{ if(checkBudgets()) render(); }catch(_){}
      try{ if(handleQuickLink()) render(); }catch(_){}
    }
  });
  // A widget tap / Back Tap can launch us with ?quick=… — open entry straight away.
  setTimeout(()=>{ try{ if(handleQuickLink()) render(); }catch(e){ console.warn('[Faisaa] quick link',e); } }, 120);
  if(S.ui.autoPosted){
    const {count,names}=S.ui.autoPosted; S.ui.autoPosted=null;
    setTimeout(()=>toast('ok', count===1
      ? `${names[0]} posted automatically`
      : `${count} scheduled items posted`),700);
  }
}
