<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" id="themeColor" content="#F2F2F7">
<title>Faisaa</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<script>
/* Faisaa sync client
   Layer 1: localStorage  → survives reload/airplane mode, instant boot.
   Layer 2: WebSocket     → realtime push/pull between devices.
   Layer 3: outbox        → ops made offline replay in order on reconnect.
   The UI never awaits the network: every change applies locally first. */
(function(){
  const LS_STATE  = 'faisaa.state.v1';
  const LS_OUTBOX = 'faisaa.outbox.v1';
  const LS_DEVICE = 'faisaa.deviceId';
  const LS_NAME   = 'faisaa.deviceName';

  function guessName(){
    const ua = navigator.userAgent;
    if (/iPhone/.test(ua)) return 'iPhone';
    if (/iPad/.test(ua))   return 'iPad';
    if (/Android/.test(ua))return 'Android';
    if (/Mac/.test(ua))    return 'Mac';
    if (/Windows/.test(ua))return 'PC';
    return 'Device';
  }
  const store = {
    get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(_){ return d; } },
    set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch(_){ return false; } },
    raw(k,d){ try{ return localStorage.getItem(k)||d; }catch(_){ return d; } },
    rawSet(k,v){ try{ localStorage.setItem(k,v); }catch(_){} }
  };

  let deviceId = store.raw(LS_DEVICE);
  if (!deviceId){ deviceId = 'd'+Math.random().toString(36).slice(2,10); store.rawSet(LS_DEVICE, deviceId); }
  let deviceName = store.raw(LS_NAME) || guessName();
  store.rawSet(LS_NAME, deviceName);

  const Sync = {
    deviceId, deviceName,
    online:false, peers:0, peerNames:[], rev:0,
    outbox: store.get(LS_OUTBOX, []),
    ws:null, tries:0, timer:null, onchange:null, onstatus:null,
    enabled: true,

    /* ---- local snapshot ---- */
    loadLocal(){ return store.get(LS_STATE, null); },
    saveLocal(snapshot){ store.set(LS_STATE, snapshot); },
    clearLocal(){ try{ localStorage.removeItem(LS_STATE); localStorage.removeItem(LS_OUTBOX); }catch(_){} this.outbox=[]; },

    setName(n){ deviceName=this.deviceName=n||guessName(); store.rawSet(LS_NAME, deviceName);
                if(this.ws) try{ this.ws.close(); }catch(_){} },

    /* ---- outbound ops ---- */
    push(entity, id, op, data){
      const rec = { entity, id, op, data: data||null, ts: Date.now(), dev: deviceId };
      this.outbox.push(rec);
      store.set(LS_OUTBOX, this.outbox);
      this.flush();
    },
    flush(){
      if (!this.enabled || !this.outbox.length) return;
      if (this.ws && this.ws.readyState === 1){
        try {
          this.ws.send(JSON.stringify({ type:'ops', ops:this.outbox, deviceId }));
          this.outbox = []; store.set(LS_OUTBOX, this.outbox);
          this.status();
        } catch(_){}
      } else if (navigator.onLine) {
        // WebSocket down but the network is up — fall back to HTTP.
        const batch = this.outbox.slice();
        fetch('/api/ops', { method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ ops:batch, deviceId }) })
          .then(r=>r.ok?r.json():null)
          .then(j=>{ if(j&&j.ok){ this.outbox = this.outbox.slice(batch.length);
                                  store.set(LS_OUTBOX,this.outbox); this.status(); } })
          .catch(()=>{});
      }
    },

    /* ---- connection ---- */
    connect(){
      if (!this.enabled) return;
      if (this.ws && (this.ws.readyState===0 || this.ws.readyState===1)) return;
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      const url = `${proto}://${location.host}/ws?id=${encodeURIComponent(deviceId)}&name=${encodeURIComponent(deviceName)}`;
      let ws;
      try { ws = new WebSocket(url); } catch(_) { return this.retry(); }
      this.ws = ws;

      ws.onopen = ()=>{ this.tries=0; this.online=true; this.status(); this.flush(); };
      ws.onmessage = ev=>{
        let m; try{ m=JSON.parse(ev.data); }catch(_){ return; }
        if (m.type==='hello'){
          this.rev = m.rev;
          // Server is authoritative on connect, then our queued ops replay on top.
          if (this.onchange) this.onchange(m.state, 'hello');
          this.flush();
        } else if (m.type==='ops'){
          this.rev = m.rev;
          if (this.onchange) this.onchange(m.ops, 'ops');
        } else if (m.type==='presence'){
          this.peers = Math.max(0, m.count-1);
          this.peerNames = (m.devices||[]).filter(n=>n!==deviceName);
          this.status();
        } else if (m.type==='reload'){ location.reload(); }
      };
      ws.onclose = ()=>{ this.online=false; this.ws=null; this.status(); this.retry(); };
      ws.onerror = ()=>{ try{ ws.close(); }catch(_){} };
    },
    retry(){
      if (!this.enabled) return;
      clearTimeout(this.timer);
      const wait = Math.min(1000 * Math.pow(1.6, this.tries++), 15000);
      this.timer = setTimeout(()=>this.connect(), wait + Math.random()*400);
    },
    status(){ if (this.onstatus) this.onstatus(this); },

    start(){
      this.connect();
      addEventListener('online',  ()=>{ this.tries=0; this.connect(); this.flush(); });
      addEventListener('offline', ()=>{ this.online=false; this.status(); });
      // Coming back from the iOS app switcher: sockets are often silently dead.
      document.addEventListener('visibilitychange', ()=>{
        if (!document.hidden){ this.connect(); this.flush(); }
      });
      setInterval(()=>{ if(this.ws && this.ws.readyState===1)
        { try{ this.ws.send(JSON.stringify({type:'ping'})); }catch(_){} } }, 20000);
    }
  };
  window.FaisaaSync = Sync;
})();
</script>
<script>
/* Fallback: if the sync client ever fails to load (file preview, offline,
   sandboxed iframe), the app must still boot — never a blank screen.
   This stub provides the same interface, backed by in-memory storage. */
if(!window.FaisaaSync){
  (function(){
    var mem = {};
    var store = {
      get:function(k,d){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(_){ return (k in mem)?mem[k]:d; } },
      set:function(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(_){ mem[k]=v; } return true; },
      raw:function(k,d){ try{ return localStorage.getItem(k)||d; }catch(_){ return mem[k]||d; } },
      rawSet:function(k,v){ try{ localStorage.setItem(k,v); }catch(_){ mem[k]=v; } }
    };
    var deviceId = store.raw('faisaa.deviceId') || ('d'+Math.random().toString(36).slice(2,10));
    store.rawSet('faisaa.deviceId', deviceId);
    window.FaisaaSync = {
      deviceId: deviceId, deviceName: store.raw('faisaa.deviceName') || 'Device',
      online:false, peers:0, peerNames:[], rev:0, outbox:[], ws:null,
      onchange:null, onstatus:null, enabled:false,
      loadLocal:function(){ return store.get('faisaa.state.v1', null); },
      saveLocal:function(s){ store.set('faisaa.state.v1', s); },
      clearLocal:function(){ try{ localStorage.removeItem('faisaa.state.v1'); }catch(_){} delete mem['faisaa.state.v1']; this.outbox=[]; },
      setName:function(n){ this.deviceName=n||'Device'; store.rawSet('faisaa.deviceName', this.deviceName); },
      push:function(){}, flush:function(){}, start:function(){}, status:function(){}
    };
  })();
}
</script>

<script>
/* Applied before first paint so there is never a flash of the wrong theme. */
(function(){
  var pref='system';
  try{ pref=localStorage.getItem('faisaa.appearance')||'system'; }catch(e){}
  var mq=window.matchMedia('(prefers-color-scheme: dark)');
  var resolve=function(p){ return p==='system' ? (mq.matches?'dark':'light') : p; };
  var apply=function(p){
    var mode=resolve(p);
    document.documentElement.setAttribute('data-theme',mode);
    var m=document.getElementById('themeColor');
    if(m) m.setAttribute('content', mode==='dark'?'#000000':'#F2F2F7');
  };
  window.__theme={
    pref:pref, resolve:resolve, apply:apply,
    set:function(p){
      this.pref=p;
      try{ localStorage.setItem('faisaa.appearance',p); }catch(e){}
      document.documentElement.classList.add('theme-anim');
      apply(p);
      clearTimeout(this._t);
      this._t=setTimeout(function(){ document.documentElement.classList.remove('theme-anim'); },400);
    }
  };
  apply(pref);
  // Follow the OS only while the user is on "System".
  var onSys=function(){ if(window.__theme.pref==='system') apply('system'); };
  mq.addEventListener ? mq.addEventListener('change',onSys) : mq.addListener(onSys);
})();
</script>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}

  :root{
    --inr:#2E5BFF; --inr2:#1B3FCC; --mvr:#00A88E; --mvr2:#00806C;
    --red:#FF3B30; --green:#34C759; --orange:#FF9500;
    --bg:#F2F2F7;
    --card:#FFFFFF;
    --card2:rgba(118,118,128,.08);
    --sep:rgba(60,60,67,.13);
    --txt:#000; --txt2:#3C3C43; --txt3:rgba(60,60,67,.6); --txt4:rgba(60,60,67,.3);
    --barbg:rgba(249,249,249,.82);
    --fill:rgba(118,118,128,.12);
    --sheetbg:#F2F2F7;
    --safe-t:env(safe-area-inset-top,0px);
    --safe-b:env(safe-area-inset-bottom,0px);
    --tabh:49px;
  }
  :root[data-theme="dark"]{
    --bg:#000000; --card:#1C1C1E; --card2:rgba(118,118,128,.18);
    --sep:rgba(84,84,88,.55);
    --txt:#fff; --txt2:#EBEBF5; --txt3:rgba(235,235,245,.6); --txt4:rgba(235,235,245,.3);
    --barbg:rgba(28,28,30,.8); --fill:rgba(118,118,128,.24); --sheetbg:#1C1C1E;
  }

  /* Cross-fade the palette on theme change; suppressed on first paint. */
  :root.theme-anim,
  :root.theme-anim body,
  :root.theme-anim .card,.theme-anim .field,.theme-anim .group,.theme-anim .row,
  :root.theme-anim .navbar,.theme-anim .tabbar,.theme-anim .sheet,.theme-anim .catbar,
  :root.theme-anim .seg,.theme-anim .seg button,.theme-anim .note,.theme-anim .toast,
  :root.theme-anim .amountbox,.theme-anim .addcard,.theme-anim .chip,.theme-anim .track{
    transition:background-color .32s ease,color .32s ease,box-shadow .32s ease;
  }

  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,sans-serif;
    font-size:17px;line-height:1.3;overflow:hidden;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }

  /* ===== App shell: fills the viewport, no frame ===== */
  #app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
  .wrap{width:100%;max-width:680px;margin:0 auto}

  /* ===== Nav bar ===== */
  .navbar{
    flex:0 0 auto;z-index:50;position:relative;
    padding:calc(var(--safe-t) + 6px) 0 6px;
    background:var(--barbg);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
    box-shadow:0 0 0 rgba(0,0,0,0);transition:box-shadow .25s ease;
  }
  .navbar.scrolled{box-shadow:0 .5px 0 var(--sep)}
  .navbar .row{display:flex;align-items:center;justify-content:space-between;min-height:42px;padding:0 16px;gap:8px}
  .navbar h1{margin:0;font-size:34px;font-weight:700;letter-spacing:-.9px;font-family:-apple-system,"SF Pro Display",sans-serif}
  .navbar .inline{font-size:17px;font-weight:600;letter-spacing:-.2px;flex:1;text-align:center}
  .navbtn{background:none;border:none;color:var(--inr);font-size:24px;cursor:pointer;padding:4px;
          display:flex;align-items:center;justify-content:center;min-width:34px;transition:opacity .15s}
  .navbtn:active{opacity:.4}
  .navbtn:disabled{opacity:.3;cursor:default}
  .backbtn{background:none;border:none;color:var(--inr);font-size:17px;cursor:pointer;
           display:flex;align-items:center;gap:2px;padding:4px 0;min-width:34px;transition:opacity .15s}
  .backbtn:active{opacity:.4}
  .backbtn i{font-style:normal;font-size:26px;font-weight:300;line-height:.9;margin-top:-2px}

  /* ===== Scroll area ===== */
  .screen{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
          padding:8px 0 calc(var(--tabh) + var(--safe-b) + 28px);scroll-behavior:smooth;overscroll-behavior-y:contain}
  .screen::-webkit-scrollbar{width:0;display:none}
  .screen .wrap{padding:0 16px}

  /* ===== Tab bar ===== */
  .tabbar{
    flex:0 0 auto;z-index:70;position:relative;
    height:calc(var(--tabh) + var(--safe-b));padding-bottom:var(--safe-b);
    background:var(--barbg);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
    box-shadow:0 -.5px 0 var(--sep);
  }
  .tabbar .wrap{display:flex;height:var(--tabh)}
  .tabbtn{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;justify-content:center;
          gap:2px;color:var(--txt3);cursor:pointer;font-size:10px;font-weight:500;letter-spacing:.05px;
          transition:color .2s;padding:0;font-family:inherit}
  .tabbtn svg{width:26px;height:26px;transition:transform .3s cubic-bezier(.34,1.5,.64,1)}
  .tabbtn:active svg{transform:scale(.88)}
  .tabbtn.on svg{transform:scale(1.02)}

  /* ===== Cards: flat iOS inset-grouped, no strokes ===== */
  .card{background:var(--card);border-radius:12px;overflow:hidden}
  .card.big{border-radius:16px}
  .pad{padding:16px}
  .sec{margin-bottom:26px}
  .sechead{display:flex;align-items:flex-end;justify-content:space-between;margin:0 4px 9px;gap:10px}
  .sechead h2{margin:0;font-size:20px;font-weight:700;letter-spacing:-.45px}
  .sechead button{background:none;border:none;color:var(--inr);font-size:15px;font-weight:400;cursor:pointer;
                  padding:0;font-family:inherit;transition:opacity .15s}
  .sechead button:active{opacity:.4}

  /* ===== Total hero ===== */
  .total{border-radius:18px;padding:18px;color:#fff;position:relative;overflow:hidden;cursor:pointer;
         transition:transform .25s cubic-bezier(.34,1.3,.64,1);animation:rise .55s cubic-bezier(.2,.85,.3,1) backwards}
  .total:active{transform:scale(.975)}
  .total.inr{background:linear-gradient(135deg,#3D68FF,#1B3FCC)}
  .total.mvr{background:linear-gradient(135deg,#0CBBA0,#00806C)}
  @keyframes rise{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
  .total .top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
  .total .who{display:flex;gap:9px;align-items:center}
  .total .who .flag{font-size:21px;line-height:1}
  .total .who b{font-size:15px;font-weight:600;display:block;letter-spacing:-.2px}
  .total .who span{font-size:11.5px;opacity:.72;display:block;margin-top:1px}
  .total .amt{font-size:36px;font-weight:700;letter-spacing:-1.3px;font-variant-numeric:tabular-nums;line-height:1.05;
              font-family:-apple-system,"SF Pro Display",sans-serif}
  .total .stats{display:flex;gap:20px;align-items:center;margin-top:14px;font-size:12px}
  .total .stats .s{display:flex;gap:6px;align-items:center}
  .total .stats .s i{font-style:normal;opacity:.72;font-size:9.5px;display:block;text-transform:uppercase;letter-spacing:.5px}
  .total .stats .s b{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
  .total .pill{background:rgba(255,255,255,.2);border-radius:20px;padding:3px 9px;font-size:10.5px;font-weight:600}
  .segnote{display:flex;gap:6px;align-items:flex-start;justify-content:center;color:var(--txt4);
           font-size:12px;margin-top:14px;padding:0 12px;text-align:center;line-height:1.35}

  /* ===== Quick actions ===== */
  .quick{display:flex;gap:6px;margin:0 0 26px}
  .qa{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;
      font-size:11.5px;color:var(--txt);font-weight:400;transition:transform .2s cubic-bezier(.34,1.4,.64,1);
      font-family:inherit;padding:0}
  .qa:active{transform:scale(.9)}
  .qa .ic{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:21px}

  /* ===== Mini cards ===== */
  .minis{display:flex;gap:12px}
  .mini{flex:1;padding:14px;cursor:pointer;transition:transform .2s}
  .mini:active{transform:scale(.98)}
  .mini .v{font-size:19px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums;margin:8px 0 1px}
  .mini .l{font-size:11.5px;color:var(--txt3)}
  .spark{height:44px;margin-top:10px;display:block}

  /* ===== Badges ===== */
  .badge{display:inline-flex;gap:4px;align-items:center;border-radius:20px;padding:2.5px 8px;
         font-size:10.5px;font-weight:600;letter-spacing:.2px;white-space:nowrap}
  .badge.inr{background:rgba(46,91,255,.14);color:var(--inr)}
  .badge.mvr{background:rgba(0,168,142,.16);color:#00907a}
  :root[data-theme="dark"] .badge.mvr{color:#2AD4B8}
  :root[data-theme="dark"] .badge.inr{background:rgba(46,91,255,.22);color:#7B9BFF}

  /* ===== Rows ===== */
  .row{display:flex;align-items:center;gap:12px;padding:10px 16px;cursor:pointer;
       transition:background .12s;position:relative;background:var(--card)}
  .row:active{background:var(--fill)}
  .row+.row::before{content:'';position:absolute;top:0;left:60px;right:0;height:.5px;background:var(--sep)}
  .row .ic{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
           font-size:17px;flex:0 0 38px}
  .row .mid{flex:1;min-width:0}
  .row .mid b{display:block;font-size:16px;font-weight:400;letter-spacing:-.3px;
              white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .mid span{font-size:12.5px;color:var(--txt3);letter-spacing:-.05px}
  .row .rt{text-align:right;flex:0 0 auto}
  .row .rt b{display:block;font-size:16px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
  .row .rt b.cr{color:var(--green)}
  .chev{color:var(--txt4);font-size:17px;font-weight:300;margin-left:2px}

  /* ===== Account card ===== */
  .acct{display:flex;align-items:center;gap:13px;padding:12px 14px;margin-bottom:10px;cursor:pointer;
        transition:transform .2s cubic-bezier(.34,1.3,.64,1)}
  .acct:active{transform:scale(.978)}
  .acct .ic{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;
            font-size:20px;color:#fff;flex:0 0 46px}
  .acct .mid{flex:1;min-width:0}
  .acct .mid .nm{display:flex;gap:7px;align-items:center;margin-bottom:2px}
  .acct .mid .nm b{font-size:16px;font-weight:500;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .acct .mid span{font-size:12.5px;color:var(--txt3);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .acct .bal{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right;letter-spacing:-.3px}
  .acct .bal.neg{color:var(--red)}

  .addcard{background:var(--card2);border-radius:12px;padding:15px;display:flex;gap:13px;align-items:center;
           cursor:pointer;transition:transform .2s,background .15s}
  .addcard:active{transform:scale(.98);background:var(--fill)}
  .addcard .plus{width:40px;height:40px;border-radius:50%;background:var(--fill);display:flex;align-items:center;
                 justify-content:center;font-size:22px;color:var(--txt3);flex:0 0 40px;font-weight:300}
  .addcard .t{font-size:15.5px;font-weight:400;letter-spacing:-.2px}
  .addcard .s{font-size:13px;color:var(--inr);margin-top:1px}

  /* ===== Empty state ===== */
  .empty{text-align:center;padding:52px 24px;animation:rise .5s cubic-bezier(.2,.85,.3,1)}
  .empty .g{font-size:52px;opacity:.28;margin-bottom:14px;line-height:1}
  .empty h3{margin:0 0 7px;font-size:19px;font-weight:600;letter-spacing:-.4px}
  .empty p{margin:0 auto;font-size:15px;color:var(--txt3);max-width:290px;line-height:1.42;letter-spacing:-.2px}
  .empty .btn{margin-top:20px}

  /* ===== Buttons ===== */
  .btn{background:var(--inr);color:#fff;border:none;border-radius:14px;padding:15px 24px;font-size:17px;
       font-weight:600;cursor:pointer;transition:transform .16s,opacity .16s;font-family:inherit;letter-spacing:-.3px}
  .btn:active{transform:scale(.965);opacity:.9}
  .btn:disabled{opacity:.32;cursor:default;transform:none}
  .btn.wide{width:100%}
  .btn.sec2{background:var(--fill);color:var(--inr)}
  .btn.danger{background:var(--red)}
  .btn.mvr{background:var(--mvr)}
  .btn.plain{background:none;color:var(--red);font-weight:400}

  /* ===== Segmented ===== */
  .seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;position:relative}
  .seg button{flex:1;background:none;border:none;padding:7px 6px;font-size:13px;font-weight:500;border-radius:7px;
              cursor:pointer;color:var(--txt);transition:all .25s cubic-bezier(.3,1,.4,1);font-family:inherit;
              letter-spacing:-.1px;white-space:nowrap}
  .seg button.on{background:var(--card);box-shadow:0 3px 8px rgba(0,0,0,.12),0 1px 1px rgba(0,0,0,.04);font-weight:600}
  :root[data-theme="dark"] .seg button.on{background:#636366;box-shadow:none}
  .seg button:disabled{opacity:.4;cursor:default}

  /* ===== Forms: iOS inset grouped ===== */
  .group{background:var(--card);border-radius:12px;overflow:hidden;margin-bottom:8px}
  .field{background:var(--card);padding:12px 16px;display:flex;align-items:center;gap:12px;min-height:46px;position:relative}
  .field+.field::before{content:'';position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
  .field.tap{cursor:pointer;transition:background .12s}
  .field.tap:active{background:var(--fill)}
  .field label{font-size:16px;flex:0 0 auto;color:var(--txt);letter-spacing:-.3px}
  .field input,.field select{flex:1;border:none;background:none;font-size:16px;font-family:inherit;text-align:right;
                             outline:none;color:var(--txt);min-width:0;letter-spacing:-.3px;padding:0;appearance:none}
  .field select{text-align-last:right;color:var(--txt3);cursor:pointer}
  .field input::placeholder{color:var(--txt4)}
  .grouphead{font-size:13px;color:var(--txt3);text-transform:uppercase;letter-spacing:.4px;
             margin:26px 16px 7px;font-weight:400}
  .groupfoot{font-size:13px;color:var(--txt3);margin:7px 16px 0;line-height:1.35;letter-spacing:-.1px}
  .err{display:flex;gap:6px;align-items:flex-start;color:var(--red);font-size:13px;margin:7px 16px 0;
       animation:shake .4s cubic-bezier(.36,.07,.19,.97);line-height:1.35}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}

  .amountbox{background:var(--card);border-radius:14px;padding:18px}
  .amountrow{display:flex;align-items:baseline;gap:9px}
  .amountrow .sym{font-size:28px;font-weight:600;color:var(--txt3);letter-spacing:-.8px}
  .amountrow input{flex:1;border:none;background:none;font-size:46px;font-weight:700;letter-spacing:-2px;
                   outline:none;font-family:-apple-system,"SF Pro Display",sans-serif;width:100%;min-width:0;
                   color:var(--txt);padding:0;font-variant-numeric:tabular-nums}
  .amountrow input::placeholder{color:var(--txt4)}

  /* ===== Category chips ===== */
  .cats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .cat{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 2px;
       border-radius:12px;cursor:pointer;transition:all .22s cubic-bezier(.34,1.4,.64,1);font-family:inherit}
  .cat .ic{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;
           font-size:17px;transition:all .22s}
  .cat span{font-size:11px;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;
            letter-spacing:-.1px}
  .cat:active{transform:scale(.92)}
  .cat.on{transform:scale(1.04)}
  .cat.on span{font-weight:600}

  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 8px;margin:0 -16px 14px;scrollbar-width:none}
  .chips::-webkit-scrollbar{height:0;display:none}
  .chip{flex:0 0 auto;border:none;border-radius:20px;padding:9px 14px;font-size:13.5px;font-weight:500;
        cursor:pointer;display:flex;gap:5px;align-items:center;transition:all .2s;font-family:inherit;letter-spacing:-.1px}
  .chip:active{transform:scale(.94)}

  /* ===== Toggle ===== */
  .toggle{width:51px;height:31px;border-radius:16px;background:var(--fill);position:relative;
          cursor:pointer;transition:background .3s cubic-bezier(.3,1,.4,1);flex:0 0 51px}
  .toggle.on{background:var(--green)}
  .toggle i{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;
            box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.06);
            transition:transform .3s cubic-bezier(.34,1.4,.64,1)}
  .toggle.on i{transform:translateX(20px)}

  /* ===== Gauge ===== */
  .gauge{display:flex;flex-direction:column;align-items:center;padding:26px 16px}
  .gwrap{position:relative;width:200px;height:200px}
  .gwrap svg{transform:rotate(-90deg);display:block}
  .gcenter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
  .gcenter .l{font-size:13px;color:var(--txt3)}
  .gcenter .v{font-size:28px;font-weight:700;letter-spacing:-.9px;font-variant-numeric:tabular-nums;
              font-family:-apple-system,"SF Pro Display",sans-serif}
  .gcenter .v.neg{color:var(--red)}
  .gstats{display:flex;gap:20px;align-items:center;margin-top:18px}
  .gstats .s{text-align:center}
  .gstats .s i{font-style:normal;display:block;font-size:12px;color:var(--txt3);margin-bottom:3px}
  .gstats .s b{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
  .gstats .div{width:.5px;height:28px;background:var(--sep)}

  /* ===== Charts ===== */
  .barchart{display:flex;align-items:flex-end;gap:10px;height:152px;padding:0 2px;margin-top:10px}
  .barcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer}
  .bar{width:100%;max-width:32px;border-radius:6px;transition:height .75s cubic-bezier(.2,.9,.3,1),opacity .25s;min-height:4px}
  .barcol .lb{font-size:11px;color:var(--txt3)}
  .barcol.on .lb{font-weight:700;color:var(--txt)}

  .donutwrap{position:relative;display:flex;justify-content:center;padding:10px 0 6px}
  .donutcenter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
               gap:3px;pointer-events:none}
  .donutcenter .l{font-size:13px;color:var(--txt3)}
  .donutcenter .v{font-size:23px;font-weight:700;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
  .donutcenter .p{font-size:12px;color:var(--txt3)}
  .slice{cursor:pointer;transition:opacity .25s,d .3s}

  .catbar{padding:12px 16px;cursor:pointer;transition:background .15s;position:relative;background:var(--card)}
  .catbar:active{background:var(--fill)}
  .catbar+.catbar::before{content:'';position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
  .catbar .t{display:flex;align-items:center;gap:13px}
  .catbar .ic{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
              font-size:15px;flex:0 0 36px}
  .catbar .info{flex:1;min-width:0}
  .catbar .l1{display:flex;justify-content:space-between;font-size:15.5px;margin-bottom:6px;letter-spacing:-.3px}
  .catbar .l1 b{font-weight:600;font-variant-numeric:tabular-nums}
  .track{height:6px;border-radius:3px;background:var(--fill);overflow:hidden}
  .track i{display:block;height:100%;border-radius:3px;transition:width .85s cubic-bezier(.2,.9,.3,1)}
  .catbar .l2{display:flex;justify-content:space-between;font-size:11.5px;color:var(--txt3);margin-top:5px}

  .summaries{display:flex;gap:10px;margin-bottom:18px}
  .sm{flex:1;padding:13px}
  .sm .h{display:flex;gap:4px;align-items:center;font-size:11.5px;font-weight:600;margin-bottom:6px;letter-spacing:-.1px}
  .sm .v{font-size:17px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums}

  .monthbar{display:flex;align-items:center;justify-content:space-between;padding:11px 12px;margin-bottom:18px}
  .monthbar button{background:none;border:none;color:var(--inr);font-size:20px;cursor:pointer;padding:4px 14px;
                   font-family:inherit;font-weight:300;transition:opacity .15s}
  .monthbar button:active{opacity:.4}
  .monthbar button:disabled{color:var(--txt4);cursor:default}
  .monthbar .m{font-size:17px;font-weight:600;letter-spacing:-.4px}

  /* ===== Sheet ===== */
  .backdrop{position:absolute;inset:0;background:rgba(0,0,0,.4);z-index:90;opacity:0;pointer-events:none;
            transition:opacity .35s ease;backdrop-filter:blur(0px)}
  .backdrop.on{opacity:1;pointer-events:auto}
  .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--sheetbg);border-radius:12px 12px 0 0;z-index:95;
         transform:translateY(101%);transition:transform .45s cubic-bezier(.32,.94,.28,1);display:flex;flex-direction:column;
         max-height:calc(100% - var(--safe-t) - 12px);box-shadow:0 -1px 30px rgba(0,0,0,.18)}
  .sheet.on{transform:translateY(0)}
  .sheet .grab{width:36px;height:5px;border-radius:3px;background:var(--txt4);margin:6px auto 0;flex:0 0 auto}
  .sheet .shead{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 10px;flex:0 0 auto;gap:8px}
  .sheet .shead .t{font-size:17px;font-weight:600;letter-spacing:-.3px;flex:1;text-align:center}
  .sheet .shead button{background:none;border:none;color:var(--inr);font-size:17px;cursor:pointer;font-family:inherit;
                       padding:2px 0;min-width:58px;transition:opacity .15s;letter-spacing:-.3px}
  .sheet .shead button:active{opacity:.4}
  .sheet .shead button:first-child{text-align:left}
  .sheet .shead button:last-child{text-align:right}
  .sheet .shead button.pri{font-weight:600}
  .sheet .shead button:disabled{color:var(--txt4)}
  .sheet .sbody{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px calc(var(--safe-b) + 30px);
                overscroll-behavior-y:contain}
  .sheet .sbody::-webkit-scrollbar{width:0;display:none}
  .sheet .sbody > .grouphead:first-child{margin-top:12px}

  /* ===== Toast ===== */
  .toast{position:absolute;top:calc(var(--safe-t) + 10px);left:12px;right:12px;z-index:120;display:flex;gap:11px;
         align-items:center;background:var(--card);border-radius:26px;padding:13px 18px;
         box-shadow:0 10px 34px rgba(0,0,0,.18),0 2px 6px rgba(0,0,0,.08);font-size:15px;font-weight:500;
         transform:translateY(-130px);opacity:0;transition:all .45s cubic-bezier(.32,1.25,.4,1);pointer-events:none;
         letter-spacing:-.3px;max-width:660px;margin:0 auto}
  .toast.on{transform:translateY(0);opacity:1;pointer-events:auto}
  .toast.ok{color:var(--green)}
  .toast.warn{color:var(--orange)}
  .toast.err{color:var(--red)}
  .toast.info{color:var(--inr)}
  .toast .msg{flex:1;min-width:0}
  .toast button{background:none;border:none;color:inherit;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit}

  /* ===== Offline banner ===== */
  .offline{position:absolute;top:0;left:0;right:0;z-index:110;background:linear-gradient(90deg,#FF9500,#FF7A00);
           color:#fff;font-size:13px;font-weight:600;display:flex;gap:8px;align-items:center;
           padding:calc(var(--safe-t) + 9px) 16px 9px;letter-spacing:-.2px;
           transform:translateY(-100%);transition:transform .4s cubic-bezier(.3,1,.4,1)}
  .offline.on{transform:translateY(0)}
  .offline .q{margin-left:auto;background:rgba(255,255,255,.24);border-radius:12px;padding:3px 9px;font-size:11px}

  /* ===== Quick-add FAB (center tab) ===== */
  .fabslot{flex:0 0 auto;width:64px;display:flex;align-items:flex-start;justify-content:center;position:relative}
  .fab{width:54px;height:54px;border-radius:50%;border:none;cursor:pointer;position:absolute;top:-19px;
       background:linear-gradient(140deg,#0CBBA0,#00806C);color:#fff;font-size:29px;font-weight:300;line-height:1;
       display:flex;align-items:center;justify-content:center;padding:0;font-family:inherit;
       box-shadow:0 6px 18px rgba(0,168,142,.42),0 2px 5px rgba(0,0,0,.14);
       transition:transform .34s cubic-bezier(.34,1.5,.5,1),box-shadow .25s}
  .fab.inrTint{background:linear-gradient(140deg,#4C74FF,#1B3FCC);box-shadow:0 6px 18px rgba(46,91,255,.42),0 2px 5px rgba(0,0,0,.14)}
  .fab:active{transform:scale(.9)}
  .fab span{display:block;transition:transform .34s cubic-bezier(.34,1.5,.5,1)}
  .fab.open span{transform:rotate(135deg)}
  .fab.open{box-shadow:0 3px 10px rgba(0,0,0,.2)}

  .fabmask{position:absolute;inset:0;z-index:78;opacity:0;pointer-events:none;
           background:rgba(0,0,0,.28);backdrop-filter:blur(2px);transition:opacity .3s ease}
  .fabmask.on{opacity:1;pointer-events:auto}

  .fabmenu{position:absolute;left:0;right:0;bottom:calc(var(--tabh) + var(--safe-b) + 14px);z-index:80;
           display:flex;flex-direction:column;align-items:center;gap:11px;pointer-events:none;padding:0 16px}
  .fabmenu.on{pointer-events:auto}
  .fabitem{display:flex;align-items:center;gap:13px;background:var(--card);border:none;cursor:pointer;
           border-radius:16px;padding:13px 18px 13px 14px;width:100%;max-width:330px;font-family:inherit;
           box-shadow:0 8px 26px rgba(0,0,0,.16);opacity:0;transform:translateY(22px) scale(.92);
           transition:opacity .3s cubic-bezier(.2,.9,.3,1),transform .34s cubic-bezier(.32,1.35,.5,1),background .12s}
  .fabmenu.on .fabitem{opacity:1;transform:none}
  .fabitem:active{background:var(--fill)}
  .fabitem .ic{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;
               font-size:19px;flex:0 0 42px;color:#fff}
  .fabitem .tx{text-align:left;flex:1;min-width:0}
  .fabitem .tx b{display:block;font-size:16px;font-weight:600;color:var(--txt);letter-spacing:-.3px}
  .fabitem .tx span{display:block;font-size:12.5px;color:var(--txt3);margin-top:1px}

  /* ===== Recurring ===== */
  .recrow{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;position:relative;background:var(--card)}
  .recrow:active{background:var(--fill)}
  .recrow+.recrow::before{content:'';position:absolute;top:0;left:60px;right:0;height:.5px;background:var(--sep)}
  .recrow .ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;
              font-size:17px;flex:0 0 38px}
  .recrow .mid{flex:1;min-width:0}
  .recrow .mid b{display:block;font-size:16px;font-weight:500;letter-spacing:-.3px;
                 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .recrow .mid span{font-size:12.5px;color:var(--txt3);display:block;
                    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .recrow .amt{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:0 0 auto}
  .recrow.off{opacity:.45}
  .duepill{font-size:10.5px;font-weight:700;padding:2.5px 8px;border-radius:20px;letter-spacing:.2px;
           background:rgba(255,149,0,.16);color:#B36A00;white-space:nowrap}
  :root[data-theme="dark"] .duepill{color:#FFB340}
  .duepill.soon{background:rgba(52,199,89,.16);color:#1F8B3C}
  :root[data-theme="dark"] .duepill.soon{color:#4ADE6A}

  .dayscroll{display:flex;gap:7px;overflow-x:auto;padding:4px 16px 10px;margin:0 -16px;scrollbar-width:none}
  .dayscroll::-webkit-scrollbar{height:0;display:none}
  .daybtn{flex:0 0 auto;width:42px;height:42px;border-radius:12px;border:none;cursor:pointer;font-family:inherit;
          font-size:15px;font-weight:600;background:var(--fill);color:var(--txt);transition:all .2s cubic-bezier(.34,1.4,.64,1)}
  .daybtn:active{transform:scale(.9)}
  .daybtn.on{color:#fff;transform:scale(1.06)}

  /* ===== Transfer visual ===== */
  .tvis{display:flex;align-items:center;gap:10px;padding:16px 14px}
  .tvis .side{flex:1;min-width:0;text-align:center}
  .tvis .side .lb{font-size:11px;color:var(--txt3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
  .tvis .side .ic{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;
                  font-size:20px;color:#fff;margin:0 auto 7px}
  .tvis .side .nm{font-size:14px;font-weight:600;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tvis .side .am{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:4px;letter-spacing:-.3px}
  .tvis .arrow{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--txt4)}
  .tvis .arrow .a{font-size:22px;line-height:1}
  .tvis .arrow .r{font-size:9.5px;font-weight:700;color:var(--orange);white-space:nowrap}
  .swapbtn{width:34px;height:34px;border-radius:50%;border:none;background:var(--fill);color:var(--txt3);
           font-size:16px;cursor:pointer;font-family:inherit;transition:transform .3s cubic-bezier(.34,1.5,.5,1)}
  .swapbtn:active{transform:rotate(180deg) scale(.9)}

  /* ===== Appearance preview tiles ===== */
  .themepreview{display:flex;gap:14px;margin-top:14px}
  .tp{flex:1;border-radius:14px;padding:11px;cursor:pointer;position:relative;
      transition:transform .22s cubic-bezier(.34,1.4,.64,1),box-shadow .22s;
      display:flex;flex-direction:column;gap:7px}
  .tp:active{transform:scale(.96)}
  .tp.light{background:#F2F2F7}
  .tp.dark{background:#000}
  .tp.on{box-shadow:0 0 0 2.5px var(--bg),0 0 0 5px var(--inr)}
  .tpchrome{display:flex;align-items:center;gap:5px;margin-bottom:1px}
  .tpdot{width:13px;height:13px;border-radius:50%;flex:0 0 13px}
  .tp.light .tpdot{background:linear-gradient(135deg,#0CBBA0,#00806C)}
  .tp.dark .tpdot{background:linear-gradient(135deg,#0CBBA0,#00806C)}
  .tpbar{height:6px;border-radius:3px;flex:1}
  .tp.light .tpbar{background:rgba(60,60,67,.22)}
  .tp.dark .tpbar{background:rgba(235,235,245,.3)}
  .tpcard{border-radius:7px;padding:7px 8px;display:flex;flex-direction:column;gap:4px}
  .tp.light .tpcard{background:#FFF}
  .tp.dark .tpcard{background:#1C1C1E}
  .tpline{height:5px;border-radius:3px;display:block}
  .tp.light .tpline{background:rgba(60,60,67,.18)}
  .tp.dark .tpline{background:rgba(235,235,245,.24)}
  .w40{width:40%}.w45{width:45%}.w60{width:60%}.w70{width:70%}
  .tplabel{font-size:12px;font-weight:600;text-align:center;margin-top:2px;letter-spacing:-.1px}
  .tp.light .tplabel{color:#000}
  .tp.dark .tplabel{color:#fff}

  /* ===== Sync pill ===== */
  .syncpill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;
            padding:3px 9px;border-radius:20px;letter-spacing:-.1px;white-space:nowrap;
            background:var(--fill);color:var(--txt3);transition:all .3s}
  .syncpill .dot{width:6px;height:6px;border-radius:50%;background:currentColor;display:block}
  .syncpill.ok{background:rgba(52,199,89,.15);color:#1F8B3C}
  .syncpill.live{background:rgba(46,91,255,.15);color:var(--inr)}
  .syncpill.live .dot{animation:pulse 1.6s ease-in-out infinite}
  .syncpill.off{background:rgba(255,149,0,.16);color:#B36A00}
  :root[data-theme="dark"] .syncpill.ok{color:#4ADE6A}
  :root[data-theme="dark"] .syncpill.live{color:#7B9BFF}
  :root[data-theme="dark"] .syncpill.off{color:#FFB340}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.75)}}

  /* ===== Budgets ===== */
  .bud{padding:12px 16px;position:relative;cursor:pointer;background:var(--card);transition:background .12s}
  .bud:active{background:var(--fill)}
  .bud+.bud::before{content:'';position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
  .bud .top{display:flex;align-items:center;gap:11px}
  .bud .ic{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
           font-size:15px;flex:0 0 34px}
  .bud .nm{flex:1;min-width:0}
  .bud .nm b{display:block;font-size:15.5px;font-weight:500;letter-spacing:-.3px;
             white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bud .nm span{font-size:12px;color:var(--txt3);display:block;margin-top:1px}
  .bud .amt{text-align:right;flex:0 0 auto}
  .bud .amt b{display:block;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
  .bud .amt i{font-style:normal;font-size:11.5px;color:var(--txt3)}
  .bud .track{margin-top:9px;height:7px}
  .bud.over .track i{background:var(--red)!important}
  .bud .amt b.over{color:var(--red)}
  .bud .amt b.near{color:var(--orange)}
  .limitchip{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:20px;letter-spacing:.2px;
             background:rgba(52,199,89,.16);color:#1F8B3C;white-space:nowrap}
  .limitchip.near{background:rgba(255,149,0,.16);color:#B36A00}
  .limitchip.over{background:rgba(255,59,48,.16);color:#C4271E}
  :root[data-theme="dark"] .limitchip{color:#4ADE6A}
  :root[data-theme="dark"] .limitchip.near{color:#FFB340}
  :root[data-theme="dark"] .limitchip.over{color:#FF6B60}

  /* budget mark: dotted limit line inside a report bar */
  .track.lim{overflow:visible;position:relative}
  .track.lim em{position:absolute;top:-2px;bottom:-2px;width:2px;border-radius:2px;
                background:var(--txt3);opacity:.55;display:block}

  /* badge on quick actions / nav */
  .qab{position:relative}
  .qab .dotb{position:absolute;top:-2px;right:calc(50% - 26px);min-width:17px;height:17px;border-radius:9px;
             background:var(--red);color:#fff;font-size:10.5px;font-weight:700;display:flex;align-items:center;
             justify-content:center;padding:0 4px;box-shadow:0 0 0 2px var(--bg);font-style:normal}

  /* alerts */
  .alertrow{display:flex;gap:11px;align-items:flex-start;padding:12px 16px;position:relative;background:var(--card)}
  .alertrow+.alertrow::before{content:'';position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
  .alertrow .ic{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
                font-size:16px;flex:0 0 34px;background:rgba(255,59,48,.14)}
  .alertrow.warn .ic{background:rgba(255,149,0,.16)}
  .alertrow .mid{flex:1;min-width:0}
  .alertrow .mid b{display:block;font-size:15px;font-weight:600;letter-spacing:-.3px}
  .alertrow .mid span{display:block;font-size:12.5px;color:var(--txt3);margin-top:2px;line-height:1.35}
  .alertrow.unread{background:rgba(46,91,255,.05)}
  :root[data-theme="dark"] .alertrow.unread{background:rgba(46,91,255,.12)}

  /* note chips inside the txn sheet */
  .quicknotes{display:flex;gap:7px;overflow-x:auto;padding:8px 16px 2px;margin:0 -16px;scrollbar-width:none}
  .quicknotes::-webkit-scrollbar{height:0;display:none}
  .qn{flex:0 0 auto;border:none;border-radius:20px;padding:7px 12px;font-size:12.5px;font-weight:500;
      background:var(--fill);color:var(--txt2);cursor:pointer;font-family:inherit;letter-spacing:-.1px;
      transition:transform .18s,background .15s;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .qn:active{transform:scale(.94)}

  /* inline budget preview under the amount */
  .budprev{display:flex;gap:8px;align-items:center;margin:10px 16px 0;font-size:12.5px;color:var(--txt3)}
  .budprev .track{flex:1;height:5px}
  .budprev b{font-weight:600;font-variant-numeric:tabular-nums;color:var(--txt2)}

  /* setup steps */
  .steps{counter-reset:st;margin:0;padding:0;list-style:none}
  .steps li{position:relative;padding:11px 16px 11px 46px;font-size:14.5px;color:var(--txt2);
            line-height:1.4;letter-spacing:-.2px;background:var(--card)}
  .steps li+li::before{content:'';position:absolute;top:0;left:46px;right:0;height:.5px;background:var(--sep)}
  .steps li em{position:absolute;left:16px;top:11px;width:20px;height:20px;border-radius:50%;
               background:var(--fill);color:var(--txt2);font-style:normal;font-size:11.5px;font-weight:700;
               display:flex;align-items:center;justify-content:center}
  .steps li b{font-weight:600;color:var(--txt)}
  .linkbox{background:var(--card);border-radius:12px;padding:13px 16px;display:flex;gap:10px;align-items:center}
  .linkbox code{flex:1;min-width:0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;
                color:var(--txt2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .linkbox button{background:none;border:none;color:var(--inr);font-size:14px;font-weight:600;cursor:pointer;
                  font-family:inherit;white-space:nowrap;padding:2px}

  /* ===== Notes ===== */
  .note{display:flex;gap:8px;padding:12px 14px;background:var(--card2);border-radius:11px;
        font-size:13px;color:var(--txt3);line-height:1.4;letter-spacing:-.1px}
  .note.warn{background:rgba(255,149,0,.14);color:#B36A00}

  :root[data-theme="dark"] .note.warn{color:#FFB340}
  :root[data-theme="dark"] .note.blue{color:#7B9BFF}
</style>

<div id="app">
  <div class="offline" id="offlineBanner">

</div>

<script>
/* ============ STATE ============ */
const uid = () => 'x'+Math.random().toString(36).slice(2,10);

const CUR = {
  INR:{code:'INR',sym:'₹',flag:'🇮🇳',name:'Indian Rupee',color:'#2E5BFF',cls:'inr'},
  MVR:{code:'MVR',sym:'Rf',flag:'🇲🇻',name:'Maldivian Rufiyaa',color:'#00A88E',cls:'mvr'}
};

const CATS = [
  {id:'c1',name:'Groceries',icon:'🛒',color:'#34C759',flow:'expense'},
  {id:'c2',name:'Dining',icon:'🍽️',color:'#FF9500',flow:'expense'},
  {id:'c3',name:'Transport',icon:'🚗',color:'#5AC8FA',flow:'expense'},
  {id:'c4',name:'Bills',icon:'⚡',color:'#FFCC00',flow:'expense'},
  {id:'c5',name:'Rent',icon:'🏠',color:'#AF52DE',flow:'expense'},
  {id:'c6',name:'Shopping',icon:'🛍️',color:'#FF2D55',flow:'expense'},
  {id:'c7',name:'Health',icon:'💊',color:'#FF3B30',flow:'expense'},
  {id:'c8',name:'Travel',icon:'✈️',color:'#007AFF',flow:'expense'},
  {id:'c9',name:'Salary',icon:'💰',color:'#30D158',flow:'income'},
  {id:'c10',name:'Other',icon:'⋯',color:'#8E8E93',flow:'both'},
  {id:'c11',name:'Transfer',icon:'⇄',color:'#8E8E93',flow:'both',system:true}
];

const KINDS={bank:{l:'Bank',i:'🏦'},savings:{l:'Savings',i:'📈'},card:{l:'Card',i:'💳'},wallet:{l:'Wallet',i:'👛'},cash:{l:'Cash',i:'💵'}};
const bankLike = k => k==='bank'||k==='savings'||k==='card';

let S={};
function seed(){
  const A=(name,inst,kind,cur,open,mask,color)=>({id:uid(),name,inst,kind,currency:cur,opening:open,mask,color,include:true,archived:false});
  const a=[
    A('HDFC Savings','HDFC Bank','bank','INR',1845000,'4821','#2E5BFF'),
    A('SBI Salary','State Bank of India','savings','INR',9230000,'1190','#0B7285'),
    A('Paytm','Paytm Payments','wallet','INR',214000,null,'#00B8D9'),
    A('BML Current','Bank of Maldives','bank','MVR',2480000,'7745','#C0392B'),
    A('MIB Savings','Maldives Islamic Bank','savings','MVR',6120000,'3302','#1E8E3E'),
    A('m-Faisaa','Ooredoo','wallet','MVR',187500,null,'#E8590C')
  ];
  const d=n=>{const x=new Date();x.setDate(x.getDate()-n);return x.toISOString()};
  const T=(ai,cur,amt,dir,cat,merch,days)=>({id:uid(),accountId:a[ai].id,currency:cur,amount:amt,dir,categoryId:cat,merchant:merch,at:d(days),sync:'synced',fx:null});
  const t=[
    T(3,'MVR',38500,'debit','c1','Agora Supermarket',1),
    T(3,'MVR',12000,'debit','c3','Ferry Terminal',2),
    T(5,'MVR',45000,'debit','c4','Ooredoo Top-up',3),
    T(4,'MVR',240000,'debit','c5','Monthly rent',5),
    T(0,'INR',129900,'debit','c6','Amazon',2),
    T(0,'INR',64000,'debit','c2','Cafe Coffee Day',4),
    T(2,'INR',22000,'debit','c3','Uber',6),
    T(1,'INR',450000,'debit','c4','Electricity',8),
    T(3,'MVR',78000,'debit','c2','Seagull Cafe',9),
    T(0,'INR',210000,'debit','c7','Pharmacy',11),
    T(1,'INR',8500000,'credit','c9','Monthly salary',12),
    T(3,'MVR',3200000,'credit','c9','Consulting',14),
    T(4,'MVR',95000,'debit','c1','Redwave',18),
    T(0,'INR',340000,'debit','c8','IndiGo',22),
    T(3,'MVR',56000,'debit','c2','Dinner',40),
    T(0,'INR',180000,'debit','c6','Myntra',45),
    T(3,'MVR',310000,'debit','c5','Rent Jul',48),
    T(0,'INR',520000,'debit','c4','Broadband',72),
    T(3,'MVR',220000,'debit','c1','Groceries Jun',75),
    T(0,'INR',260000,'debit','c2','Restaurant',100),
    T(3,'MVR',180000,'debit','c3','Taxi May',105),
    T(0,'INR',410000,'debit','c6','Electronics',135)
  ];
  S={accounts:a,txns:t.sort((x,y)=>new Date(y.at)-new Date(x.at)),
     rates:[{base:'INR',quote:'MVR',rate:0.184,pinned:true,at:new Date().toISOString()}],
     recurring:[
       {id:uid(),name:'Monthly rent',accountId:a[4].id,currency:'MVR',amount:240000,dir:'debit',
        categoryId:'c5',day:1,active:true,lastRun:null,created:new Date().toISOString()},
       {id:uid(),name:'Salary',accountId:a[1].id,currency:'INR',amount:8500000,dir:'credit',
        categoryId:'c9',day:28,active:true,lastRun:null,created:new Date().toISOString()},
       {id:uid(),name:'Ooredoo plan',accountId:a[5].id,currency:'MVR',amount:45000,dir:'debit',
        categoryId:'c4',day:3,active:true,lastRun:null,created:new Date().toISOString()}
     ],
     settings:{primary:'MVR',hints:false,alerts:defaultAlerts()},
     budgets:[], alerts:[],
     offline:false,queue:[],
     ui:{tab:'dashboard',stack:[],reportCur:'MVR',reportMonth:new Date(),slice:null}};
  // Backdate lastRun so the catch-up engine has nothing to replay on a fresh seed.
  S.recurring.forEach(r=>{ r.lastRun=lastDueKey(r); });
}
/* seed() is called by boot() only when there is no saved or remote state. */

/* ============ MONEY ============ */
function fmt(minor,cur,opts={}){
  const c=CUR[cur],neg=minor<0,v=Math.abs(minor)/100;
  let s=v.toLocaleString(cur==='INR'?'en-IN':'en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  return (neg?'−':(opts.sign&&minor>0?'+':''))+(opts.nosym?'':c.sym+' ')+s;
}
function compact(minor,cur){
  const c=CUR[cur],v=Math.abs(minor)/100,neg=minor<0?'−':'';
  let u;
  if(cur==='INR'){ u = v>=1e7?(v/1e7).toFixed(1)+'Cr' : v>=1e5?(v/1e5).toFixed(1)+'L' : v>=1e3?(v/1e3).toFixed(1)+'K' : v.toFixed(0); }
  else { u = v>=1e6?(v/1e6).toFixed(1)+'M' : v>=1e3?(v/1e3).toFixed(1)+'K' : v.toFixed(0); }
  return neg+c.sym+' '+u;
}

/* ============ DERIVED (never merged) ============ */
const active = () => S.accounts.filter(a=>!a.archived);
const acctsIn = c => active().filter(a=>a.currency===c).sort((x,y)=>x.name.localeCompare(y.name));
const banksIn = c => acctsIn(c).filter(a=>bankLike(a.kind));
const wallets = () => active().filter(a=>!bankLike(a.kind));
const acct = id => S.accounts.find(a=>a.id===id);
const cat = id => CATS.find(c=>c.id===id);

function balance(id){
  const a=acct(id); if(!a) return 0;
  return a.opening + S.txns.filter(t=>t.accountId===id).reduce((s,t)=>s+(t.dir==='debit'?-t.amount:t.amount),0);
}
function sameMonth(iso,d){const x=new Date(iso);return x.getMonth()===d.getMonth()&&x.getFullYear()===d.getFullYear()}

function totals(cur,month=new Date()){
  const list=acctsIn(cur).filter(a=>a.include), ids=new Set(list.map(a=>a.id));
  const bal=list.reduce((s,a)=>s+a.opening,0)+S.txns.filter(t=>ids.has(t.accountId)).reduce((s,t)=>s+(t.dir==='debit'?-t.amount:t.amount),0);
  // Transfers move money, they don't spend or earn it — excluded from flow figures
  // (but they DO affect `bal`, since each leg really debits/credits its account).
  const mt=S.txns.filter(t=>ids.has(t.accountId)&&sameMonth(t.at,month)&&!t.transferId);
  return {currency:cur,balance:bal,count:list.length,
    spent:mt.filter(t=>t.dir==='debit').reduce((s,t)=>s+t.amount,0),
    earned:mt.filter(t=>t.dir==='credit').reduce((s,t)=>s+t.amount,0),
    pending:S.txns.filter(t=>ids.has(t.accountId)&&t.sync!=='synced').length};
}
const orderedTotals = () => (S.settings.primary==='INR'?['INR','MVR']:['MVR','INR']).map(c=>totals(c));

function breakdown(cur,month){
  const ids=new Set(acctsIn(cur).map(a=>a.id));
  const sp=S.txns.filter(t=>ids.has(t.accountId)&&t.dir==='debit'&&sameMonth(t.at,month)&&!t.transferId);
  const grand=sp.reduce((s,t)=>s+t.amount,0); if(!grand) return [];
  const m={};sp.forEach(t=>{m[t.categoryId]=(m[t.categoryId]||0)+t.amount});
  return Object.entries(m).map(([k,v])=>({cat:cat(k),total:v,share:v/grand,count:sp.filter(t=>t.categoryId===k).length}))
    .sort((a,b)=>b.total-a.total);
}
function trend(cur,n=6){
  const out=[],now=new Date();
  for(let i=n-1;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);out.push({month:d,...totals(cur,d)})}
  return out;
}
function dailySpend(cur,month){
  const ids=new Set(acctsIn(cur).map(a=>a.id));
  const days=new Date(month.getFullYear(),month.getMonth()+1,0).getDate(),out=Array(days).fill(0);
  S.txns.filter(t=>ids.has(t.accountId)&&t.dir==='debit'&&sameMonth(t.at,month)&&!t.transferId)
    .forEach(t=>{out[new Date(t.at).getDate()-1]+=t.amount});
  return out;
}

/* ============ NOTES ON TRANSACTIONS ============ */
/* A note is free text describing exactly what the money was for — "taxi to
   Male ferry", "lunch with Ali". It is stored on the transaction itself so it
   travels with sync, appears in the detail view, and stays searchable. */

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g,m=>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* A few recent notes for the picked category, shown as one-tap chips. */
function quickNotes(f){
  const seen=new Set(),out=[];
  for(const t of S.txns){
    if(t.categoryId!==f.cat||!t.note) continue;
    const n=t.note.trim(); if(!n||seen.has(n.toLowerCase())) continue;
    seen.add(n.toLowerCase()); out.push(n);
    if(out.length>=5) break;
  }
  if(!out.length) return '';
  return `<div class="quicknotes">${out.map(n=>
    `<button class="qn" data-n="${esc(n)}" onclick="setNote(this.dataset.n)" title="${esc(n)}">${esc(n)}</button>`).join('')}</div>`;
}
function setNote(n){ sheetState.form.note=n; renderSheet(); }

/* Live "how does this land against the category limit" line under the amount. */
function budPreview(f,p){
  const a=acct(f.acct); if(!a||!p||!p.minor||f.dir!=='debit') return '';
  const b=budgetOf(f.cat,a.currency); if(!b) return '';
  const spent=catSpent(f.cat,a.currency,new Date());
  const after=spent+p.minor, pct=Math.min(after/b.limit,1)*100;
  const lvl=budLevel(after,b.limit);
  const col=lvl==='over'?'var(--red)':lvl==='near'?'var(--orange)':CUR[a.currency].color;
  const label=lvl==='over'
    ? `<b style="color:var(--red)">${fmt(after-b.limit,a.currency)} over</b> the ${fmt(b.limit,a.currency)} limit`
    : `<b>${fmt(b.limit-after,a.currency)}</b> left of ${fmt(b.limit,a.currency)} this month`;
  return `<div class="budprev"><span style="font-size:13px">🎯</span>${label}
    <span class="track" style="max-width:110px"><i style="width:${pct}%;background:${col}"></i></span></div>`;
}

/* ============ CATEGORY BUDGETS ============ */
/* One monthly limit per category, set in one currency. Because INR and MVR are
   never merged, a category can hold up to two limits — one per currency — and
   each is measured only against spending in its own currency.
   `lastLevel` remembers the alert state already announced this month so the
   app never nags about the same threshold twice: ok → near (80%) → over (100%). */

function budKey(catId,cur){ return catId+':'+cur; }

function budgetsFor(){ return (S.budgets||[]).filter(b=>b&&b.limit>0); }
function budgetOf(catId,cur){ return (S.budgets||[]).find(b=>b.categoryId===catId&&b.currency===cur)||null; }

/* Spend in one category, one currency, for a given month. Transfers excluded. */
function catSpent(catId,cur,month){
  const ids=new Set(acctsIn(cur).map(a=>a.id));
  return S.txns.filter(t=>ids.has(t.accountId)&&t.dir==='debit'&&t.categoryId===catId&&
      sameMonth(t.at,month)&&!t.transferId).reduce((s,t)=>s+t.amount,0);
}

/* Level for a given spend. 80% = "near", 100%+ = "over", otherwise "ok". */
function budLevel(spent,limit){
  if(!limit||limit<=0) return 'ok';
  if(spent>=limit) return 'over';
  if(spent>=limit*0.8) return 'near';
  return 'ok';
}
const BUD_RANK={ok:0,near:1,over:2};

/* Full picture for one budget row, for a month. */
function budgetState(b,month){
  const spent=catSpent(b.categoryId,b.currency,month);
  const pct=b.limit>0?spent/b.limit:0;
  return {b,spent,pct,remaining:b.limit-spent,level:budLevel(spent,b.limit),
          category:cat(b.categoryId)};
}

/* All budgets for a currency, richest overspend first, rolled up with totals. */
function budgetRows(cur,month=new Date()){
  const rows=budgetsFor().filter(b=>b.currency===cur)
    .map(b=>budgetState(b,month))
    .sort((x,y)=>(y.pct-x.pct)||(y.spent-x.spent));
  const limit=rows.reduce((s,r)=>s+r.b.limit,0);
  const spent=rows.reduce((s,r)=>s+r.spent,0);
  return {rows,limit,spent};
}

/* Status for one threshold change: `over` | `near` | `back`, or null when the
   level did not move (or moved in the harmless direction). */
function budTransition(prev,next){
  if(BUD_RANK[next]>BUD_RANK[prev]) return next==='over'?'over':'near';
  if(next==='ok'&&prev!=='ok') return 'back';
  return null;
}

/* ============ ALERTS ============ */
/* Persistent, per-device inbox. Budget notifications land here so nothing is
   missed when the app is closed — the bell badge shows the unread count. */

let _notifSupported = false;
try{ _notifSupported = ('Notification' in window); }catch(_){}

function osPermission(){
  try{ return _notifSupported ? Notification.permission : 'unsupported'; }catch(_){ return 'unsupported'; }
}
function defaultAlerts(){ return {budgets:true,os:false,lastMonth:null}; }
function alertsCfg(){
  if(!S.settings.alerts) S.settings.alerts=defaultAlerts();
  return S.settings.alerts;
}
function unreadAlerts(){ return (S.alerts||[]).filter(a=>!a.read).length; }

function addAlert(a){
  S.alerts=S.alerts||[];
  // Collapse repeats of the same kind/category/currency/month into one row.
  const dup=S.alerts.find(x=>x.kind===a.kind&&x.categoryId===a.categoryId&&
    x.currency===a.currency&&x.month===a.month);
  if(dup){
    Object.assign(dup,{spent:a.spent,limit:a.limit,at:a.at,read:false});
    return dup;
  }
  const rec=Object.assign({id:uid(),read:false,at:new Date().toISOString()},a);
  S.alerts.unshift(rec);
  // Keep the inbox bounded — the ledger is the record, this is just a nudge.
  if(S.alerts.length>120) S.alerts.length=120;
  return rec;
}

/* Fire the OS-level notification when the user has opted in and granted it. */
function pushOS(title,body){
  if(osPermission()!=='granted'||!alertsCfg().os) return;
  try{
    const n=new Notification(title,{body,tag:'faisaa-budget',renotify:true,silent:false});
    n.onclick=()=>{ try{ window.focus(); go('alerts'); n.close(); }catch(_){} };
  }catch(_){}
}

/* Human copy for a budget event. */
function budAlert(a){
  const c=CUR[a.currency],cat_=cat(a.categoryId);
  const name=cat_?cat_.name:'Category';
  const icon=cat_?cat_.icon:'•';
  const over=a.kind==='over';
  const diff=Math.abs(a.spent-a.limit);
  return {
    icon,
    title: over ? `${name} is over its limit` : `${name} is close to its limit`,
    body: over
      ? `Spent ${fmt(a.spent,a.currency)} of ${fmt(a.limit,a.currency)} — ${fmt(diff,a.currency)} over for ${monthName(a.month)}.`
      : `Spent ${fmt(a.spent,a.currency)} of ${fmt(a.limit,a.currency)} — ${fmt(a.limit-a.spent,a.currency)} left for ${monthName(a.month)}.`,
    short: over
      ? `${name} over by ${fmt(diff,a.currency,{nosym:false})}`
      : `${Math.round((a.spent/a.limit)*100)}% of ${name} limit`
  };
}
function monthName(key){
  if(!key) return 'this month';
  const [y,m]=key.split('-').map(Number);
  return new Date(y,m-1,1).toLocaleDateString('en',{month:'long',year:'numeric'});
}

/* Called after every mutation (and on boot) — the single place that decides
   whether a limit was crossed. Idempotent: safe to call as often as we like. */
function checkBudgets(){
  const cfg=alertsCfg();
  const now=new Date(), mk=monthKey(now);
  let announced=false, levelMoved=false;

  // A new month starts every limit fresh: reset the remembered level and the
  // "already told you" markers, but keep the inbox history.
  if(cfg.lastMonth!==mk){
    cfg.lastMonth=mk; levelMoved=true;
    (S.budgets||[]).forEach(b=>{ b.lastLevel='ok'; b.notifiedMonth=null; b.notifiedLevel=null; });
  }
  if(!cfg.budgets) return false;

  budgetsFor().forEach(b=>{
    if(!cat(b.categoryId)) return;
    const spent=catSpent(b.categoryId,b.currency,now);
    const level=budLevel(spent,b.limit);
    const prev=b.lastLevel||'ok';
    const why=budTransition(prev,level);

    if(why==='over'||why==='near'){
      // Only announce once per threshold per month, even across devices.
      if(b.notifiedMonth!==mk||BUD_RANK[level]>BUD_RANK[b.notifiedLevel||'ok']){
        const rec=addAlert({kind:level,categoryId:b.categoryId,currency:b.currency,
          spent,limit:b.limit,month:mk,at:new Date().toISOString()});
        const copy=budAlert(rec);
        pushOS(copy.title,copy.body);
        toast(level==='over'?'warn':'info',copy.short);
        announced=true;
        b.notifiedMonth=mk; b.notifiedLevel=level;
      }
    } else if(why==='back'){
      // Spent came back under the limit (an edit or a delete) — silently reset.
      if(b.notifiedMonth===mk) b.notifiedLevel='ok';
    }
    if(b.lastLevel!==level) levelMoved=true;
    b.lastLevel=level;
  });
  // Persist whenever a level moved: `lastLevel` must survive a reload or the
  // app would re-announce the same threshold on next open.
  if(levelMoved) saveLocal();
  return announced;
}

/* ============ RECURRING ENGINE ============ */
/* A rule fires once per calendar month on `day`, clamped to the month's length
   (day 31 → Feb 28/29). `lastRun` stores the YYYY-MM key of the last posting,
   which makes catch-up idempotent: reopening the app twice never double-posts. */

/* Function declarations (not const arrows) so seed() can call them at load time. */
function monthKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function daysInMonth(y,m){ return new Date(y,m+1,0).getDate(); }
function clampDay(y,m,day){ return Math.min(day, daysInMonth(y,m)); }

/* Date this rule was/is due within the given month. */
function dueDateIn(r,y,m){ return new Date(y,m,clampDay(y,m,r.day),9,0,0); }

/* Month key of the most recent occurrence at or before today. */
function lastDueKey(r){
  const n=new Date();
  const thisMonth=dueDateIn(r,n.getFullYear(),n.getMonth());
  if(thisMonth<=n) return monthKey(n);
  const prev=new Date(n.getFullYear(),n.getMonth()-1,1);
  return monthKey(prev);
}

/* Next upcoming occurrence, as a Date. */
function nextDue(r){
  const n=new Date();
  const thisMonth=dueDateIn(r,n.getFullYear(),n.getMonth());
  if(thisMonth>n) return thisMonth;
  const nx=new Date(n.getFullYear(),n.getMonth()+1,1);
  return dueDateIn(r,nx.getFullYear(),nx.getMonth());
}
function daysUntil(d){
  const a=new Date();a.setHours(0,0,0,0);
  const b=new Date(d);b.setHours(0,0,0,0);
  return Math.round((b-a)/86400000);
}
function dueLabel(r){
  const n=daysUntil(nextDue(r));
  if(n===0) return 'Today';
  if(n===1) return 'Tomorrow';
  if(n<=31) return 'in '+n+' days';
  return nextDue(r).toLocaleDateString('en',{day:'numeric',month:'short'});
}
const ordinal = d => d+(['th','st','nd','rd'][(d%100-20)%10]||['th','st','nd','rd'][d%100]||'th');

/* Every month key strictly after `lastRun`, up to and including any due month. */
function pendingMonths(r){
  if(!r.active) return [];
  const out=[],n=new Date();
  let y,m;
  if(r.lastRun){
    const [ly,lm]=r.lastRun.split('-').map(Number);
    y=ly; m=lm-1;
    const c=new Date(y,m+1,1); y=c.getFullYear(); m=c.getMonth();
  } else {
    const c=new Date(r.created); y=c.getFullYear(); m=c.getMonth();
  }
  // Walk forward, capped at 24 months so a long-dormant rule can't flood the ledger.
  let guard=0;
  while(guard++<24){
    const due=dueDateIn(r,y,m);
    if(due>n) break;
    out.push({key:monthKey(new Date(y,m,1)),date:due});
    const c=new Date(y,m+1,1); y=c.getFullYear(); m=c.getMonth();
  }
  return out;
}

/* Post every rule that has come due. Returns the number of transactions created. */
function runRecurring(){
  let posted=0, names=[];
  (S.recurring||[]).forEach(r=>{
    if(!r.active) return;
    if(!acct(r.accountId)) return;              // account deleted → rule goes dormant
    pendingMonths(r).forEach(occ=>{
      S.txns.unshift({
        id:uid(), accountId:r.accountId, currency:r.currency, amount:r.amount,
        dir:r.dir, categoryId:r.categoryId, merchant:r.name,
        at:occ.date.toISOString(), sync:S.offline?'pendingCreate':'synced',
        fx:null, recurringId:r.id
      });
      enqueue('transaction','create');
      r.lastRun=occ.key; posted++;
      if(names.indexOf(r.name)<0) names.push(r.name);
    });
  });
  if(posted){
    S.txns.sort((x,y)=>new Date(y.at)-new Date(x.at));
    S.ui.autoPosted={count:posted,names};
  }
  return posted;
}

/* ============ VALIDATION ============ */
function parseAmount(raw,cur){
  const t=(raw||'').trim(); if(!t) return {err:'Enter an amount'};
  let c=t.replace(/[₹\s]|Rf/g,'');
  if(c.includes(',')&&c.includes('.')) c=c.replace(/,/g,'');
  else if((c.match(/,/g)||[]).length===1&&c.length-c.indexOf(',')<=3) c=c.replace(',','.');
  else c=c.replace(/,/g,'');
  if(!/^-?\d*\.?\d*$/.test(c)||c===''||c==='.') return {err:`"${t}" isn't a valid amount`};
  const n=parseFloat(c);
  if(isNaN(n)) return {err:`"${t}" isn't a valid amount`};
  if(n<=0) return {err:'Amount must be greater than zero'};
  if(n>9999999999) return {err:'That amount is too large'};
  return {minor:Math.round(n*100)};
}
function parseRate(raw){
  const t=(raw||'').trim(); if(!t) return {rate:null};
  const c=t.replace(',','.');
  if(!/^\d*\.?\d*$/.test(c)||c===''||c==='.') return {err:`"${t}" isn't a valid rate`};
  const n=parseFloat(c);
  if(isNaN(n)||!isFinite(n)) return {err:`"${t}" isn't a valid rate`};
  if(n<=0) return {err:'Exchange rate must be greater than zero'};
  if(n>100000) return {err:`A rate of ${n} looks wrong`};
  return {rate:n};
}

/* ============ TRANSFERS ============ */
/* A transfer is TWO independent transactions sharing a groupId — never one
   record spanning currencies. The out-leg is booked in the source currency,
   the in-leg in the destination currency. Each folds only into its own total,
   so INR and MVR stay completely separate even for a cross-currency move.
   The rate converts the AMOUNT ENTERED; it never converts a balance. */

const TRANSFER_CAT='c11';

function transferPreview(fromId,toId,rawAmount,rawRate){
  const from=acct(fromId), to=acct(toId);
  const res={errs:{},from,to,cross:false,out:null,inn:null,rate:null,remaining:null};
  if(!from||!to){ res.errs.acct='Pick both accounts'; return res; }
  if(from.id===to.id){ res.errs.acct='Choose two different accounts'; return res; }
  res.cross = from.currency!==to.currency;

  const p=parseAmount(rawAmount,from.currency);
  if(p.err){ res.errs.amount=p.err; return res; }
  res.out={minor:p.minor,cur:from.currency};

  if(res.cross){
    const rr=parseRate(rawRate);
    if(rr.err){ res.errs.rate=rr.err; return res; }
    if(rr.rate===null){ res.errs.rate='Enter an exchange rate for this transfer'; return res; }
    res.rate=rr.rate;
    res.inn={minor:Math.round(p.minor*rr.rate),cur:to.currency};
    if(res.inn.minor<1){ res.errs.rate='That rate converts to less than the smallest unit'; return res; }
  } else {
    res.inn={minor:p.minor,cur:to.currency};
  }

  const bal=balance(from.id);
  res.remaining=bal-p.minor;
  res.over = res.remaining<0 && bal>=0;
  return res;
}

function commitTransfer(fromId,toId,rawAmount,rawRate,note){
  const r=transferPreview(fromId,toId,rawAmount,rawRate);
  if(Object.keys(r.errs).length) return {errs:r.errs};

  const gid=uid(), when=new Date().toISOString();
  const fxOut = r.cross?{base:r.from.currency,quote:r.to.currency,rate:r.rate,converted:r.inn.minor}:null;
  const fxIn  = r.cross?{base:r.to.currency,quote:r.from.currency,rate:+(1/r.rate).toFixed(6),converted:r.out.minor}:null;

  // Leg 1 — debit source, in SOURCE currency only.
  S.txns.unshift({id:uid(),accountId:r.from.id,currency:r.from.currency,amount:r.out.minor,
    dir:'debit',categoryId:TRANSFER_CAT,merchant:'To '+r.to.name,note:note||null,
    at:when,sync:S.offline?'pendingCreate':'synced',fx:fxOut,transferId:gid,transferLeg:'out'});
  // Leg 2 — credit destination, in DESTINATION currency only.
  S.txns.unshift({id:uid(),accountId:r.to.id,currency:r.to.currency,amount:r.inn.minor,
    dir:'credit',categoryId:TRANSFER_CAT,merchant:'From '+r.from.name,note:note||null,
    at:when,sync:S.offline?'pendingCreate':'synced',fx:fxIn,transferId:gid,transferLeg:'in'});

  enqueue('transaction','create'); enqueue('transaction','create');
  S.txns.sort((x,y)=>new Date(y.at)-new Date(x.at));
  return {ok:true,groupId:gid,out:r.out,inn:r.inn,cross:r.cross};
}

/* Deleting either leg removes both — a half transfer would corrupt one ledger. */
function deleteTransfer(groupId){
  const legs=S.txns.filter(t=>t.transferId===groupId);
  S.txns=S.txns.filter(t=>t.transferId!==groupId);
  enqueue('transaction','delete');
  return legs;
}

let drainTimer=null;
function enqueue(entity,op){ if(S.offline){S.queue.push({entity,op,attempts:0});paintQueue();} }
function paintQueue(){ document.getElementById('queueCount').textContent=S.queue.length+' queued'; }
function toggleOffline(){
  S.offline=!S.offline;
  document.getElementById('offlineBanner').classList.toggle('on',S.offline);
  if(!S.offline&&S.queue.length){
    toast('info','Syncing '+S.queue.length+' change'+(S.queue.length>1?'s':'')+'…');
    const step=()=>{
      if(!S.queue.length||S.offline)return;
      S.queue.shift();paintQueue();
      const p=S.txns.find(t=>t.sync!=='synced');if(p)p.sync='synced';
      render();
      if(S.queue.length) drainTimer=setTimeout(step,350);
      else toast('ok','All changes synced');
    };
    drainTimer=setTimeout(step,500);
  }
  render();
}

let sheetState={};
function openSheet(kind,data){
  sheetState={kind,data:data||{},form:{}};
  if(kind==='newTxn'){
    const dir=(data&&data.dir)||'debit';
    sheetState.form={dir,amount:'',acct:(data&&data.acct)||(active()[0]&&active()[0].id),
                     cat:(data&&data.cat)||(dir==='credit'?'c9':'c1'),merchant:'',
                     note:(data&&data.note)||'',fx:false,rate:'',errs:{}};
  } else if(kind==='transfer'){
    const list=active();
    const from=(data&&data.from)||(list[0]&&list[0].id);
    const to=(list.find(x=>x.id!==from)||{}).id;
    const f=acct(from),t=acct(to);
    let rate='';
    if(f&&t&&f.currency!==t.currency){
      const p=S.rates.find(r=>r.base===f.currency&&r.quote===t.currency);
      const inv=S.rates.find(r=>r.base===t.currency&&r.quote===f.currency);
      rate=p?String(p.rate):(inv?String(+(1/inv.rate).toFixed(6)):'');
    }
    sheetState.form={from,to,amount:'',rate,note:'',errs:{}};
  } else if(kind==='newRec'||kind==='editRec'){
    const r=(kind==='editRec')?S.recurring.find(x=>x.id===data.id):null;
    sheetState.form=r
      ? {id:r.id,name:r.name,acct:r.accountId,dir:r.dir,amount:String(r.amount/100),
         cat:r.categoryId,day:r.day,active:r.active,errs:{}}
      : {name:'',acct:active()[0]&&active()[0].id,dir:'debit',amount:'',cat:'c4',
         day:new Date().getDate(),active:true,errs:{}};
  } else if(kind==='editTxn'){
    const t=S.txns.find(x=>x.id===data.id);
    sheetState.form={dir:t.dir,amount:(t.amount/100).toString(),acct:t.accountId,cat:t.categoryId,merchant:t.merchant||'',
                     note:t.note||'',fx:!!t.fx,rate:t.fx?t.fx.rate.toString():'',errs:{},id:t.id};
  } else if(kind==='newAcct'){
    sheetState.form={name:'',inst:'',kind:'bank',currency:'MVR',opening:'',mask:'',color:'#2E5BFF',include:true,errs:{}};
  } else if(kind==='editAcct'){
    const a=acct(data.id);
    sheetState.form={...a,opening:(a.opening/100).toString(),inst:a.inst||'',mask:a.mask||'',errs:{},id:a.id,
                     locked:S.txns.some(t=>t.accountId===a.id)};
  } else if(kind==='rate'){
    const p=S.rates.find(r=>r.base==='INR'&&r.quote==='MVR');
    sheetState.form={base:'INR',quote:'MVR',raw:p?p.rate.toString():'',errs:{}};
  } else if(kind==='newBudget'||kind==='editBudget'){
    const b=kind==='editBudget'?(S.budgets||[]).find(x=>x.id===data.id):null;
    const cur=(b&&b.currency)||(data&&data.cur)||S.settings.primary||'MVR';
    sheetState.form=b
      ? {id:b.id,cat:b.categoryId,cur:b.currency,raw:String(b.limit/100),errs:{}}
      : {cat:(data&&data.cat)||'c1',cur,raw:'',errs:{}};
  } else if(kind==='delAcct'){
    sheetState.form={choice:0,target:null,errs:{}};
  }
  renderSheet();
  document.getElementById('backdrop').classList.add('on');
  document.getElementById('sheet').classList.add('on');
}
function closeSheet(){
  document.getElementById('backdrop').classList.remove('on');
  document.getElementById('sheet').classList.remove('on');
  setTimeout(()=>{sheetState={};},420);
}

/* ============ SVG ============ */
function sparkline(vals,color){
  if(!vals.length) return '';
  const w=140,h=44,max=Math.max(...vals,1);
  const pts=vals.map((v,i)=>[i/(vals.length-1)*w,h-(v/max)*(h-6)-3]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=d+` L${w} ${h} L0 ${h} Z`;
  const gid='g'+Math.random().toString(36).slice(2,7);
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${color}" stop-opacity=".45"/><stop offset="1" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${area}" fill="url(#${gid})"/>
    <path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}
function donut(slices,sel){
  const size=216,r=90,ir=57,cx=size/2,cy=size/2;
  if(!slices.length) return '';
  let ang=-Math.PI/2,out='';
  slices.forEach((s,i)=>{
    const sweep=s.share*Math.PI*2, end=ang+sweep-0.03;
    const on=sel===i, R=on?r+7:r;
    const p=(a,rad)=>[cx+Math.cos(a)*rad,cy+Math.sin(a)*rad];
    const [x1,y1]=p(ang,R),[x2,y2]=p(end,R),[x3,y3]=p(end,ir),[x4,y4]=p(ang,ir);
    const large=sweep>Math.PI?1:0;
    const d=`M${x1} ${y1} A${R} ${R} 0 ${large} 1 ${x2} ${y2} L${x3} ${y3} A${ir} ${ir} 0 ${large} 0 ${x4} ${y4} Z`;
    out+=`<path class="slice" d="${d}" fill="${s.cat.color}" opacity="${sel===null||on?1:.3}" onclick="pickSlice(${i})"/>`;
    ang+=sweep;
  });
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${out}</svg>`;
}
function gaugeSVG(pct,color){
  const r=86,c=2*Math.PI*r;
  return `<svg width="200" height="200" viewBox="0 0 200 200">
    <circle cx="100" cy="100" r="${r}" fill="none" stroke="rgba(120,120,128,.16)" stroke-width="15"/>
    <circle cx="100" cy="100" r="${r}" fill="none" stroke="${color}" stroke-width="15" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pct)}"
      style="transition:stroke-dashoffset .6s cubic-bezier(.2,.9,.3,1),stroke .3s"/>
  </svg>`;
}

/* ---- QUICK ADD DEEP LINKS ---- */
/* iOS will not let a website install a native home-screen widget, so Faisaa
   exposes a URL that opens straight into a pre-filled entry sheet. That URL is
   what a Shortcuts widget, a Lock Screen widget or Back Tap (double-tap the
   back of the iPhone) is pointed at — one tap, entry sheet already open.
   Everything is optional; no parameters still opens a blank expense. */

function quickLink(opts){
  const o=opts||{};
  const base=location.origin+location.pathname;
  const p=[];
  p.push('quick='+(o.kind||'expense'));
  if(o.amount) p.push('amount='+encodeURIComponent(o.amount));
  if(o.cat)    p.push('cat='+encodeURIComponent(o.cat));
  if(o.note)   p.push('note='+encodeURIComponent(o.note));
  if(o.acct)   p.push('acct='+encodeURIComponent(o.acct));
  return base+'?'+p.join('&');
}

/* Read the deep-link parameters once the app is ready and open the sheet. */
let _quickHandled=null;
function handleQuickLink(){
  let q='';
  try{ q=(location.search||'').replace(/^\?/,''); }catch(_){}
  const hash=(location.hash||'').replace(/^#/,'');
  if(!q&&hash.includes('quick=')) q=hash;
  if(!q) return false;
  const params={};
  q.split('&').forEach(kv=>{ const [k,v]=kv.split('='); if(k) params[decodeURIComponent(k)]=decodeURIComponent(v||''); });
  const kind=params.quick;
  if(!kind) return false;
  if(_quickHandled===location.href) return false;
  _quickHandled=location.href;

  if(!active().length){ openSheet('newAcct'); return true; }

  if(kind==='transfer'){ openSheet('transfer'); return true; }
  if(kind==='budget'){
    const c=S.ui.budgetCur||S.settings.primary||'MVR';
    openSheet(params.cat?'editBudget':'newBudget', params.cat?{id:(budgetOf(params.cat,c)||{}).id}:{cat:params.cat,cur:c});
    return true;
  }
  const dir=kind==='income'?'credit':'debit';
  // Prefer an account in the currency the link implies (MVR by default).
  let a=params.acct?acct(params.acct):null;
  if(!a){
    const want=params.cur||S.settings.primary||'MVR';
    a=acctsIn(want)[0]||active()[0];
  }
  openSheet('newTxn',{
    dir,
    acct:a&&a.id,
    cat:params.cat||(dir==='credit'?'c9':'c1'),
    note:params.note||''
  });
  // Amount is set after the sheet exists so the parser sees the right currency.
  if(params.amount){
    sheetState.form.amount=params.amount;
    renderSheet();
  }
  return true;
}

function requestOS(){
  const cfg=alertsCfg();
  if(osPermission()==='unsupported'){ toast('info','Add Faisaa to your Home Screen to allow notifications'); return; }
  if(osPermission()==='granted'){ withSync(()=>{cfg.os=!cfg.os}); render();
    toast('ok',cfg.os?'System notifications on':'System notifications off'); return; }
  try{
    Notification.requestPermission().then(p=>{
      if(p==='granted'){ withSync(()=>{cfg.os=true}); toast('ok','Notifications on'); }
      else toast('info','Allow notifications in Settings to use this');
      render();
    });
  }catch(_){ toast('info','Notifications are not available here'); }

function copyLink(url){
  const done=()=>toast('ok','Link copied');
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done).catch(fallback);
    else fallback();
  }catch(_){ fallback(); }
  function fallback(){
    try{
      const ta=document.createElement('textarea');ta.value=url;ta.style.position='fixed';ta.style.opacity='0';
      document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);done();
    }catch(_){ toast('info','Long-press the link to copy it'); }
  }
}

        maxlength="240" oninput="TR.note=this.value" style="text-align:left"></div>
